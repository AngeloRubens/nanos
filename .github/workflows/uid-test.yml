name: uid mkdir test

on:
  push:
    branches: [ci/uid-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget git python3 nasm qemu-system-x86 qemu-utils
      - name: Build kernel and run mkdir, getuid-dependent tests
        run: |
          make -j"$(nproc)" PLATFORM=pc kernel
          make PLATFORM=pc -C test/runtime mkdir
          make PLATFORM=pc TARGET=mkdir run-noaccel
