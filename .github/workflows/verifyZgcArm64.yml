name: ZGC on nanos — GC matrix + backing-store probe (arm64)

# ZGC is the one GC that does not start in a stock nanos image: it needs a
# shared memory FILE to back the heap, and asks for one via memfd_create(2),
# whose handler lives in the *shmem klib* (klib/shmem.c: a tmpfs instance plus
# swap_syscall_handler) rather than in the base kernel. An image built without
# that klib gets ENOSYS, and ZGC's only fallback -- a file on a filesystem whose
# statfs f_type is TMPFS_MAGIC -- is closed too, because statfs_internal() never
# fills f_type in.
#
# Loading the klib is necessary but was not sufficient: ZGC then obtained its
# heap backing file and died committing memory into it, because fallocate() was
# implemented by tfs alone and returned EINVAL on a tmpfs file. That is fixed
# upstream ("fs: dispatch fallocate() through the filesystem"), and the other
# half of the pair is on this ref: punching a hole zeroed the pages and kept
# them, so the memory only came back when the file was closed and a process
# could be killed for memory it had already released ("fs: give back the pages
# of a punched hole on tmpfs"). Both live partly in the tmpfs klib -- which is
# why the steps below install the klibs built here over the prebuilt ones ops
# ships. Everything else ZGC needs already worked (huge PROT_NONE reservations,
# MAP_FIXED commit, MADV_DONTNEED, punch-hole).
#
# The first two jobs run stock-vs-klib on the kernel built from THIS ref:
#   * job "gc-matrix"      - boots a real allocation workload under every GC the
#                            JRE ships. G1/Serial/Parallel are the control and
#                            are gated; ZGC runs twice, without the klib (must
#                            fail on the backing file) and with it (must start).
#   * job "backing-store"  - a C probe running INSIDE nanos that exercises the
#                            exact primitives ZGC's backing store is built from
#                            (memfd, statfs magic, huge PROT_NONE reservation,
#                            MAP_SHARED multi-mapping + coherency, MAP_FIXED
#                            commit into the reservation, and punch-hole
#                            uncommit: whether the pages come back at the punch
#                            with the file still mapped, whether the hole still
#                            reads and re-faults as a hole, and what an
#                            unaligned hole does to the pages at its edges),
#                            once without the klib and once with it.
#
#   * job "runtime-test-shmem" - nanos's own memfd runtime test, which the same
#                            change extends with the fallocate and sealing
#                            cases, run through the upstream `make run-noaccel`
#                            harness so the assertions are checked against nanos
#                            rather than against Linux.
#
# The klib names are the ones ops ships (~/.ops/<ver>/klibs/{tmpfs,shmem}), but
# the binaries installed here are built from this ref; nanos's own
# test/runtime/shmem.c covers the same multi-mapping pattern ZGC relies on, so
# this is exercising a supported path, not a hack.
#
# TCG on the free hosted arm64 runner is enough — nothing here needs KVM.
# (GitHub-hosted arm64 runners do NOT expose /dev/kvm.)

on:
  push:
    branches: [ci/zgc-probe]
    paths:
      - 'src/**'
      - 'klib/**'
      - 'test/runtime/shmem.c'
      - '.github/workflows/verifyZgcArm64.yml'
  workflow_dispatch:
    inputs:
      jre_package:
        description: "HotSpot JRE ops package"
        default: "AngeloRubens/TemurinJREarm64Linux:25.0.1"
      zgc_expect:
        description: "gate ZGC-with-klib (default) or only measure it"
        default: "must-start"
        type: choice
        options: [must-start, report]

env:
  JRE_PACKAGE: ${{ inputs.jre_package || 'AngeloRubens/TemurinJREarm64Linux:25.0.1' }}
  ZGC_EXPECT: ${{ inputs.zgc_expect || 'must-start' }}

jobs:
  # ====================================================================
  # Which garbage collectors actually run inside nanos? Each GC gets its own
  # boot of the same self-verifying allocation workload, so the answer is
  # "the GC completed a real collection", not merely "the VM initialized".
  # ====================================================================
  gc-matrix:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          # ops's get.sh gates on `which qemu-system-x86_64` even on arm64, so
          # the qemu-system metapackage (pulls qemu-system-x86) is required just
          # to satisfy that check; qemu-system-arm/aarch64 actually boot the
          # arm64 guest. Mirrors the known-good verifyCpuinfoArm64 job.
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Set up a JDK to compile the workload
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile GcChurn (forces real collections, then self-checks)
        run: |
          cat > GcChurn.java <<'EOF'
          import java.util.ArrayList;
          import java.util.List;

          /* Allocates several times the heap so the collector must actually run,
             while keeping a live set that is checked at the end: a GC that
             corrupts or drops a live object shows up as MISMATCH, not as a
             silent pass. Kept small on purpose — this boots under TCG. */
          public class GcChurn {
              static long fnv(byte[] b) {
                  long h = 0xcbf29ce484222325L;
                  for (byte v : b) { h ^= (v & 0xff); h *= 0x100000001b3L; }
                  return h;
              }
              public static void main(String[] args) throws Exception {
                  final int liveCount = 64, liveSize = 512 * 1024;
                  final int rounds = Integer.getInteger("rounds", 12);
                  /* Objects above ZObjectSizeLimitMedium go into ZGC "large"
                     pages, committed as granule multiples of an arbitrary
                     size — a different allocation path from the medium pages
                     the 512K arrays of the live set land in. */
                  final int humongous = Integer.getInteger("humongous", 0);
                  final int humongousMB = Integer.getInteger("humongousMB", 32);
                  /* Seconds to idle at the end, after dropping the live set, so
                     ZGC's uncommitter has something to give back and the time
                     to do it (needs -Xms < -Xmx and a short ZUncommitDelay). */
                  final int settle = Integer.getInteger("settle", 0);
                  List<byte[]> live = new ArrayList<>(liveCount);
                  long expect = 0;
                  for (int i = 0; i < liveCount; i++) {
                      byte[] a = new byte[liveSize];
                      for (int j = 0; j < a.length; j += 997) a[j] = (byte) (i + j);
                      live.add(a);
                      expect ^= fnv(a);
                  }
                  /* Checked by sentinels rather than by hashing: under TCG,
                     walking hundreds of MB byte by byte is the slow part. */
                  List<byte[]> big = new ArrayList<>(humongous);
                  for (int i = 0; i < humongous; i++) {
                      byte[] a = new byte[humongousMB * 1024 * 1024];
                      a[0] = (byte) (i + 1);
                      a[a.length / 2] = (byte) (i + 2);
                      a[a.length - 1] = (byte) (i + 3);
                      big.add(a);
                  }
                  long sink = 0;
                  for (int r = 0; r < rounds; r++) {
                      for (int i = 0; i < 16; i++) {           /* garbage */
                          byte[] tmp = new byte[512 * 1024];
                          tmp[0] = (byte) r; tmp[tmp.length - 1] = (byte) i;
                          sink += tmp[0] + tmp[tmp.length - 1];
                      }
                      System.gc();                              /* and an explicit one */
                  }
                  long actual = 0;
                  for (byte[] a : live) actual ^= fnv(a);
                  boolean ok = (actual == expect);
                  if (!ok) System.out.println("LIVE SET MISMATCH");
                  for (int i = 0; i < big.size(); i++) {
                      byte[] a = big.get(i);
                      if ((a[0] != (byte) (i + 1)) || (a[a.length / 2] != (byte) (i + 2))
                              || (a[a.length - 1] != (byte) (i + 3))) {
                          ok = false;
                          System.out.println("HUMONGOUS MISMATCH at " + i);
                      }
                  }
                  if (settle > 0) {
                      live.clear();
                      big.clear();
                      for (int i = 0; i < settle; i++) { System.gc(); Thread.sleep(1000); }
                  }
                  System.out.println("GC " + (ok ? "OK" : "FAIL")
                          + " collector=" + gcNames()
                          + " maxHeap=" + (Runtime.getRuntime().maxMemory() >> 20) + "m"
                          + " sink=" + sink);
              }
              static String gcNames() {
                  StringBuilder sb = new StringBuilder();
                  for (java.lang.management.GarbageCollectorMXBean b :
                          java.lang.management.ManagementFactory.getGarbageCollectorMXBeans()) {
                      if (sb.length() > 0) sb.append('+');
                      sb.append(b.getName().replace(' ', '_')).append('(').append(b.getCollectionCount()).append(')');
                  }
                  return sb.length() == 0 ? "none" : sb.toString();
              }
          }
          EOF
          javac --release 11 -d . GcChurn.java
          ls -l GcChurn.class

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build kernel from this ref
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Prime ops nightly cache and swap in our kernel
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "ops kernel slot: $OPSK"
          cp /tmp/kernel-candidate.img "$OPSK"
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          # Part of the fix lives in the tmpfs klib, so the image has to load the
          # klibs built from this ref: leaving ops's prebuilt ones in place would
          # quietly test stock nanos and make a green run meaningless.
          KLIBDIR="$(dirname "$OPSK")/klibs"
          [ -d "$KLIBDIR" ] || { echo "::error::no klibs dir beside $OPSK"; exit 1; }
          for k in tmpfs shmem; do
            built="$(find output -type f -path '*/bin/*' -name "$k" | head -1)"
            [ -n "$built" ] || { echo "::error::klib '$k' was not built under output/"; exit 1; }
            cp "$built" "$KLIBDIR/$k"
            echo "klib $k <- $built"
          done

      - name: Boot the workload once per GC
        run: |
          set -o pipefail
          # -u, or sed block-buffers on a pipe and a guest that hangs shows an
          # empty section instead of the line it stopped on.
          strip_ansi() { sed -u 's/\x1b\[[0-9;]*m//g'; }
          # label|flag|klibs — Shenandoah may simply not be in this build, which
          # the log will say ("Unrecognized VM option"); that is a JRE fact, not
          # a nanos one, and is reported as such. ZGC runs twice: the stock
          # image has no memfd_create, the second one asks ops for the klibs
          # that provide it (tmpfs is listed explicitly because shmem's
          # tmpfs_new() resolves against it, exactly as test/runtime/shmem.manifest
          # does upstream).
          # label|flag|klibs|extra args (appended last, so they override the
          # defaults). The last two entries exist because heap size alone only
          # repeats the same code: what changes the path taken is the object
          # size (large pages) and -Xms < -Xmx (uncommit, i.e. the JVM punching
          # holes in the memfd rather than only committing).
          MATRIX=(
            "g1|UseG1GC||"
            "serial|UseSerialGC||"
            "parallel|UseParallelGC||"
            "shenandoah|UseShenandoahGC||"
            "z|UseZGC||"
            "z-shmem|UseZGC|\"tmpfs\", \"shmem\"|"
            "z-large|UseZGC|\"tmpfs\", \"shmem\"|\"-Xmx512m\", \"-Dhumongous=4\", \"-DhumongousMB=32\", \"-Drounds=6\","
            "z-uncommit|UseZGC|\"tmpfs\", \"shmem\"|\"-Xms64m\", \"-Xmx512m\", \"-XX:ZUncommitDelay=1\", \"-Xlog:gc+heap\", \"-Drounds=8\", \"-Dsettle=8\","
          )
          for entry in "${MATRIX[@]}"; do
            label="$(echo "$entry" | cut -d'|' -f1)"
            flag="$(echo "$entry" | cut -d'|' -f2)"
            klibs="$(echo "$entry" | cut -d'|' -f3)"
            extra="$(echo "$entry" | cut -d'|' -f4)"
            [ -n "$klibs" ] && klibline="  \"Klibs\": [${klibs}]," || klibline=""
            cat > "cfg-${label}.json" <<EOF
          {
          ${klibline}
            "Args": ["-XX:+${flag}", "-Xlog:gc+init=debug", "-Xlog:gc", "-Xms192m", "-Xmx192m",
                     "-Drounds=12", ${extra} "-cp", "/", "GcChurn"],
            "Files": ["GcChurn.class"],
            "RunConfig": { "Memory": "2G" }
          }
          EOF
            echo "=== ${label} (-XX:+${flag}) ==="
            timeout 600 ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
              --show-debug --verbose -c "cfg-${label}.json" 2>&1 \
              | strip_ansi | tee "gc-${label}.log" || true
          done

      - name: Gate the control GCs and ZGC-with-klib, report the rest
        run: |
          verdict() { # $1=logfile -> OK | FAIL | ABSENT
            if grep -q 'GC OK' "$1" 2>/dev/null; then echo OK
            elif grep -qi 'Unrecognized VM option' "$1" 2>/dev/null; then echo ABSENT
            else echo FAIL; fi
          }
          reason() { # the most specific line that explains a non-start
            # Ordered: the specific cause first, the generic "initialization
            # failed" banner only as a last resort — HotSpot prints the banner
            # BEFORE the detail, so a plain head -1 would always report the
            # useless line and misclassify a known gap as unexpected.
            # ops dumps the image manifest before booting, and that dump now
            # contains the klib names ("tmpfs", "shmem") and the whole java
            # command line, so it has to be dropped or it matches every pattern.
            local src
            src=$(grep -vE '^\s*&\{root:|^Manifest:' "$1" 2>/dev/null)
            for pat in 'memfd|tmpfs|hugetlbfs|AllocateHeapAt|backing file' \
                       'Unrecognized VM option' \
                       'Failed to|Could not|Not enough space|out of memory' \
                       'Error occurred during initialization'; do
              m=$(printf '%s\n' "$src" | grep -iE "$pat" | head -1 | cut -c1-160)
              [ -n "$m" ] && { echo "$m"; return; }
            done
          }
          {
            echo "## GC matrix inside nanos (arm64, TCG, kernel from this ref)"
            echo ""
            echo "| GC | image | result | collectors / reason |"
            echo "|---|---|---|---|"
            for l in g1 serial parallel shenandoah z z-shmem z-large z-uncommit; do
              v=$(verdict "gc-${l}.log")
              if [ "$v" = OK ]; then
                d=$(grep -o 'collector=[^ ]*' "gc-${l}.log" | head -1)
              else
                d=$(reason "gc-${l}.log")
              fi
              case "$l" in
                z-shmem)    img="+ klibs" ;;
                z-large)    img="+ klibs, 32M objects (large pages)" ;;
                z-uncommit) img="+ klibs, -Xms64m/-Xmx512m (uncommit on)" ;;
                *)          img="stock" ;;
              esac
              echo "| \`$l\` | $img | **$v** | ${d:-–} |"
            done
            echo ""
            echo "ZGC uncommit evidence (\`zUncommitter.cpp\` logs this only when it actually gives memory back):"
            echo '```'
            ev=$(grep -E 'Uncommitter|Uncommit:' gc-z-uncommit.log 2>/dev/null | head -5 || true)
            echo "${ev:-(none reported)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for l in g1 serial parallel; do          # control: these must work
            v=$(verdict "gc-${l}.log")
            echo "$l: $v"
            [ "$v" = OK ] || { echo "::error::${l} did not complete the workload — regression, see gc-${l}.log"; fail=1; }
          done

          # Stock image: ZGC is expected NOT to start, and specifically because
          # the backing file could not be created. Anything else means the story
          # in this file's header is wrong and needs re-reading.
          zv=$(verdict gc-z.log)
          zr=$(reason gc-z.log)
          echo "zgc (stock): $zv  reason: $zr"
          if [ "$zv" = OK ]; then
            echo "::warning::ZGC started WITHOUT the shmem klib — memfd_create is available in the base kernel now; update this workflow's premise"
          elif ! printf '%s' "$zr" | grep -qiE 'memfd|tmpfs|hugetlbfs|AllocateHeapAt|backing'; then
            echo "::warning::ZGC failed for an UNEXPECTED reason (not the backing-file gap): ${zr:-<none found>} — inspect gc-z.log"
          fi

          # With the klib the JVM must actually run: this is the claim.
          kv=$(verdict gc-z-shmem.log)
          echo "zgc (+klib): $kv  $(grep -o 'collector=[^ ]*' gc-z-shmem.log | head -1)"
          if [ "$kv" != OK ]; then
            msg="ZGC still does not complete with the tmpfs/shmem klibs loaded: $(reason gc-z-shmem.log)"
            if [ "$ZGC_EXPECT" = "must-start" ]; then
              echo "::error::$msg"; fail=1
            else
              echo "::warning::$msg"
            fi
          else
            echo "PASS: ZGC runs on nanos once the shmem klib provides memfd_create"
          fi

          # Large pages: objects above ZObjectSizeLimitMedium are committed as
          # whole granule multiples, a different size class from the medium
          # pages the base workload uses.
          lv=$(verdict gc-z-large.log)
          echo "zgc (+klib, large pages): $lv"
          if [ "$lv" != OK ]; then
            echo "::error::ZGC fails with humongous objects: $(reason gc-z-large.log)"
            fail=1
          fi

          # Uncommit: the only configuration where the JVM punches holes in the
          # memfd instead of only committing. Gated on the workload completing;
          # whether the uncommitter fired is reported, since it depends on
          # timing rather than on correctness.
          uv=$(verdict gc-z-uncommit.log)
          echo "zgc (+klib, uncommit): $uv"
          if [ "$uv" != OK ]; then
            echo "::error::ZGC fails with an elastic heap: $(reason gc-z-uncommit.log)"
            fail=1
          fi
          if grep -qE 'Uncommitter.*Uncommitted:' gc-z-uncommit.log 2>/dev/null; then
            echo "PASS: ZGC uncommitted memory through the memfd: $(grep -oE 'Uncommitter.*' gc-z-uncommit.log | head -1)"
          else
            echo "::warning::the uncommitter never reported giving memory back — the path stayed untested in this run (delay too long, or nothing was uncommittable)"
          fi

          sv=$(verdict gc-shenandoah.log)
          echo "shenandoah: $sv $( [ "$sv" = ABSENT ] && echo '(not built into this JRE)' )"
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-matrix-logs
          path: |
            GcChurn.java
            gc-*.log
            cfg-*.json

  # ====================================================================
  # What exactly would a memfd_create patch have to provide? Rather than
  # inferring it from ZGC's failure message, run a C probe INSIDE nanos that
  # calls the same primitives ZPhysicalMemoryBacking uses, one at a time, and
  # prints a PASS/FAIL line for each. The interesting one is #5: whether two
  # MAP_SHARED mappings of the same file are coherent — that is the property a
  # memfd implementation has to deliver, and the thing that decides whether the
  # patch is small or structural.
  # ====================================================================
  backing-store:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Build the probe (static, so the image needs no libs)
        run: |
          cat > zgcprobe.c <<'EOF'
          /* Exercises, inside nanos, the primitives ZGC's Linux backing store is
             built from. Every check prints "PROBE <name> <PASS|FAIL> <detail>";
             nothing aborts, so one missing piece does not hide the others. */
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/statfs.h>
          #include <sys/syscall.h>

          #ifndef MFD_CLOEXEC
          #define MFD_CLOEXEC 0x0001U
          #endif
          #ifndef FALLOC_FL_KEEP_SIZE
          #define FALLOC_FL_KEEP_SIZE 0x01
          #endif
          #ifndef FALLOC_FL_PUNCH_HOLE
          #define FALLOC_FL_PUNCH_HOLE 0x02
          #endif
          #define TMPFS_MAGIC     0x01021994
          #define HUGETLBFS_MAGIC 0x958458f6

          #define MB (1024UL * 1024UL)
          #define GB (1024UL * MB)

          static void ok(const char *name, int pass, const char *fmt, ...)
          {
              va_list ap; va_start(ap, fmt);
              printf("PROBE %-22s %s ", name, pass ? "PASS" : "FAIL");
              vprintf(fmt, ap);
              printf("\n");
              fflush(stdout);
              va_end(ap);
          }

          /* Makes the file account for the pages it holds. Writing through a
             mapping is not enough on aarch64: nanos never sees a mapping's pages
             as dirty there (pte_is_dirty() is a stub -- src/aarch64/page_machine.h,
             "hardware management of dirty pages" unavailable under qemu), so an
             msync writes nothing back, tmpfs is never asked to record the range,
             and the file reports zero blocks however much has been written into
             it. The write(2) path marks the pages dirty without going through the
             PTE bit, and the fsync makes tmpfs account for the range and pin it --
             which is the state a punched hole has to undo. */
          static int write_through_fd(int fd, unsigned long len, unsigned char v)
          {
              static char buf[64 * 1024];
              memset(buf, v, sizeof(buf));
              for (unsigned long off = 0; off < len; ) {
                  unsigned long n = len - off;
                  if (n > sizeof(buf))
                      n = sizeof(buf);
                  ssize_t w = pwrite(fd, buf, n, (off_t)off);
                  if (w <= 0)
                      return errno;   /* 0 on success, the errno otherwise */
                  off += (unsigned long)w;
              }
              return (fsync(fd) == 0) ? 0 : errno;
          }

          static long meminfo_free_kb(void)
          {
              FILE *f = fopen("/proc/meminfo", "r");
              char line[256];
              long v = -1;
              if (!f)
                  return -1;
              while (fgets(line, sizeof(line), f))
                  if (sscanf(line, "MemFree: %ld kB", &v) == 1)
                      break;
              fclose(f);
              return v;
          }

          /* MemFree counts the physical heap; Cached is what the page cache
             holds. A punched hole that only zeroes its pages shows up as
             neither being given back — the point of the pressure test is to
             find out whether they come back when someone else needs them. */
          static void meminfo2(long *freekb, long *cachedkb)
          {
              FILE *f = fopen("/proc/meminfo", "r");
              char line[256];
              *freekb = *cachedkb = -1;
              if (!f)
                  return;
              while (fgets(line, sizeof(line), f)) {
                  sscanf(line, "MemFree: %ld kB", freekb);
                  sscanf(line, "Cached: %ld kB", cachedkb);
              }
              fclose(f);
          }

          #define PRESS_FILL  (200 * MB)
          #define PRESS_CHUNK (8 * MB)
          #define PRESS_FLOOR (64 * MB)   /* stop asking for memory here */

          static void pressure_test(void)
          {
              long f0, c0, f1, c1, f2, c2, f3, c3;
              meminfo2(&f0, &c0);
              printf("PRESSURE baseline           MemFree=%ldkB Cached=%ldkB\n", f0, c0);
              fflush(stdout);

              long fd = syscall(SYS_memfd_create, "pressure", 0);
              if (fd < 0) {
                  ok("pressure_setup", 0, "memfd_create errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              if ((ftruncate((int)fd, PRESS_FILL) != 0)) {
                  ok("pressure_setup", 0, "ftruncate errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              char *m = mmap(NULL, PRESS_FILL, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("pressure_setup", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              memset(m, 0x5a, PRESS_FILL);          /* materialise every page */
              meminfo2(&f1, &c1);
              printf("PRESSURE filled %luM         MemFree=%ldkB Cached=%ldkB\n",
                     (unsigned long)(PRESS_FILL / MB), f1, c1);
              fflush(stdout);

              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, PRESS_FILL);
              munmap(m, PRESS_FILL);
              meminfo2(&f2, &c2);
              printf("PRESSURE punched+unmapped   MemFree=%ldkB Cached=%ldkB (punch rv=%d)\n",
                     f2, c2, pr);
              fflush(stdout);

              /* Ask for more memory than was free before the punch, without ever
                 releasing it: anything allocated beyond that can only come from
                 the pages the hole gave back. Stop at a floor rather than at
                 exhaustion -- a guest that runs out does not get ENOMEM from
                 mmap, it dies in allocate_table_page() (src/kernel/page.c), which
                 wants a contiguous 1M chunk and cannot find one once the physical
                 heap is chopped up by 4K anonymous pages -- and a dead guest
                 takes the verdict down with it. */
              unsigned long target = (unsigned long)f1 * 1024 + PRESS_FILL / 4;
              unsigned long got = 0;
              long f = f2, c;
              while ((got < target) && (f > (long)(PRESS_FLOOR / 1024))) {
                  char *a = mmap(NULL, PRESS_CHUNK, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (a == MAP_FAILED) {
                      printf("PRESSURE mmap failed after %luM errno=%d (%s)\n",
                             got / MB, errno, strerror(errno));
                      break;
                  }
                  memset(a, 0xa5, PRESS_CHUNK);
                  got += PRESS_CHUNK;
                  meminfo2(&f, &c);
                  if ((got % (40 * MB)) == 0) {
                      printf("PRESSURE touched %3luM       MemFree=%ldkB Cached=%ldkB\n",
                             got / MB, f, c);
                      fflush(stdout);
                  }
              }
              meminfo2(&f3, &c3);
              printf("PRESSURE stopped at %luM     MemFree=%ldkB (target %luM, floor %luM)\n",
                     got / MB, f3, target / MB, (unsigned long)(PRESS_FLOOR / MB));
              fflush(stdout);
              /* The gate is the memory that was free before the punch, not the
                 size of the hole: 200M would have been allocatable out of the
                 274M that were free anyway, so it would pass without the pages
                 ever coming back. */
              ok("pressure_alloc", got > (unsigned long)f1 * 1024,
                 "allocated %luM after punching %luM (free before the punch: %ldkB, after: %ldkB)",
                 got / MB, (unsigned long)(PRESS_FILL / MB), f1, f2);
              /* The page cache has to shrink at the punch itself. Before this
                 patch it did not shrink at all: the pages stayed dirty and
                 pinned, and no amount of pressure could take them back. */
              ok("punch_frees_pagecache", c2 < c1 - (long)(PRESS_FILL / 1024 / 2),
                 "Cached %ldkB -> %ldkB at the punch (MemFree %ldkB -> %ldkB), then %ldkB under pressure",
                 c1, c2, f1, f2, c3);
              close((int)fd);
          }

          /* An unaligned hole. Only whole pages can be handed back, so the pages
             the hole starts and ends in are zeroed in place instead; nothing
             outside the hole may change, and the file's own account of the pages
             it holds (st_blocks) has to follow. */
          static void punch_partial_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = 16 * ps;
              long fd = syscall(SYS_memfd_create, "partial", 0);
              if (fd < 0) {
                  ok("punch_partial", 0, "memfd_create errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              if (ftruncate((int)fd, len) != 0) {
                  ok("punch_partial", 0, "ftruncate errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              char *m = mmap(NULL, len, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("punch_partial", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              memset(m, 0xee, len);
              int wb = write_through_fd((int)fd, len, 0xee);   /* so that the file
                                           has blocks to lose; see write_through_fd */
              struct stat before, after;
              fstat((int)fd, &before);

              /* Half a page in, half a page short of the end: pages 2 and 13 are
                 partial, pages 3..12 are whole and can be freed. */
              unsigned long hs = 2 * ps + ps / 2, he = 14 * ps - ps / 2;
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                 (long)hs, (long)(he - hs));
              fstat((int)fd, &after);
              int outside_intact = ((unsigned char)m[hs - 1] == 0xee) &&
                                   ((unsigned char)m[0] == 0xee) &&
                                   ((unsigned char)m[he] == 0xee) &&
                                   ((unsigned char)m[len - 1] == 0xee);
              int inside_zero = ((unsigned char)m[hs] == 0x00) &&
                                ((unsigned char)m[3 * ps] == 0x00) &&
                                ((unsigned char)m[he - 1] == 0x00);
              ok("punch_partial", (pr == 0) && outside_intact && inside_zero,
                 "rv=%d errno=%d hole=[0x%lx,0x%lx) outside_intact=%d inside_zero=%d "
                 "(m[hs-1]=0x%02x m[hs]=0x%02x m[he-1]=0x%02x m[he]=0x%02x)",
                 pr, pr ? errno : 0, hs, he, outside_intact, inside_zero,
                 (unsigned char)m[hs - 1], (unsigned char)m[hs],
                 (unsigned char)m[he - 1], (unsigned char)m[he]);
              ok("punch_partial_blocks",
                 (wb == 0) && (before.st_blocks > 0) && (after.st_blocks < before.st_blocks),
                 "st_blocks %ld -> %ld for a %lu-page hole in a %lu-page file (write+fsync %s)",
                 (long)before.st_blocks, (long)after.st_blocks,
                 (he - hs) / ps, len / ps, wb ? strerror(wb) : "ok");
              munmap(m, len);
              close((int)fd);
          }

          int main(int argc, char **argv)
          {
              if ((argc > 1) && !strcmp(argv[1], "pressure")) {
                  pressure_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              /* 1. memfd_create: ZGC's primary heap backing file. Raw syscall so
                    a missing kernel entry shows up as ENOSYS, unambiguously. */
              long mfd = syscall(SYS_memfd_create, "zgc-probe", (unsigned)MFD_CLOEXEC);
              ok("memfd_create", mfd >= 0, "rv=%ld errno=%d (%s)",
                 mfd, mfd < 0 ? errno : 0, mfd < 0 ? strerror(errno) : "-");

              /* 2. statfs f_type: how ZGC decides a directory is tmpfs/hugetlbfs
                    when memfd_create is unavailable. */
              struct statfs sb;
              if (statfs("/", &sb) == 0) {
                  const char *kind = (sb.f_type == TMPFS_MAGIC) ? " = tmpfs, usable by ZGC"
                      : (sb.f_type == HUGETLBFS_MAGIC) ? " = hugetlbfs, usable by ZGC"
                      : (sb.f_type == 0) ? " = unset, no filesystem type reported at all"
                      : " = some other filesystem (fine, just not a ZGC fallback)";
                  /* The nanos gap is f_type never being filled in; a non-tmpfs
                     value is correct behaviour, so only zero counts as a fail. */
                  ok("statfs_f_type", sb.f_type != 0, "f_type=0x%lx%s bsize=%ld (ZGC wants tmpfs=0x%x or hugetlbfs=0x%x)",
                     (unsigned long)sb.f_type, kind, (long)sb.f_bsize, TMPFS_MAGIC, HUGETLBFS_MAGIC);
              } else
                  ok("statfs_f_type", 0, "statfs failed errno=%d (%s)", errno, strerror(errno));

              /* 3. Huge PROT_NONE reservation: ZGC reserves a multi-TB address
                    range up front and commits into it later. */
              static const unsigned long sizes[] = { 16UL * GB, 256UL * GB, 4096UL * GB, 16384UL * GB };
              static const char *names[] = { "reserve_16G", "reserve_256G", "reserve_4T", "reserve_16T" };
              void *biggest = MAP_FAILED;
              unsigned long biggest_len = 0;
              for (unsigned i = 0; i < sizeof(sizes) / sizeof(sizes[0]); i++) {
                  void *r = mmap(NULL, sizes[i], PROT_NONE,
                                 MAP_PRIVATE | MAP_ANONYMOUS | MAP_NORESERVE, -1, 0);
                  ok(names[i], r != MAP_FAILED, "addr=%p errno=%d (%s)",
                     r, r == MAP_FAILED ? errno : 0, r == MAP_FAILED ? strerror(errno) : "-");
                  if (r != MAP_FAILED) {
                      if (biggest == MAP_FAILED) { biggest = r; biggest_len = sizes[i]; }
                      else { munmap(r, sizes[i]); }
                  }
              }

              /* 4. A writable file to stand in for the memfd (the tmpfs fallback
                    ZGC would use). */
              const char *path = "/zgcprobe.dat";
              const unsigned long flen = 8 * MB;
              int fd = (mfd >= 0) ? (int)mfd : open(path, O_RDWR | O_CREAT | O_TRUNC, 0600);
              ok("backing_file_open", fd >= 0, "%s fd=%d errno=%d (%s)",
                 (mfd >= 0) ? "via memfd" : path, fd, fd < 0 ? errno : 0,
                 fd < 0 ? strerror(errno) : "-");
              if (fd < 0) {
                  printf("PROBE DONE (no backing file — remaining checks skipped)\n");
                  return 0;
              }
              int tr = ftruncate(fd, flen);
              ok("ftruncate_8M", tr == 0, "rv=%d errno=%d (%s)", tr, tr ? errno : 0,
                 tr ? strerror(errno) : "-");

              /* 5. THE decisive one: two MAP_SHARED mappings of the same file
                    offset must observe each other's writes. Without this a memfd
                    is only a name, and ZGC's heap views would silently diverge. */
              char *a = mmap(NULL, flen, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
              char *b = mmap(NULL, flen, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
              if (a != MAP_FAILED && b != MAP_FAILED) {
                  memset(a, 0xa5, 4096);
                  a[flen - 1] = 0x5a;
                  int coherent = ((unsigned char)b[0] == 0xa5) &&
                                 ((unsigned char)b[4095] == 0xa5) &&
                                 ((unsigned char)b[flen - 1] == 0x5a);
                  ok("mmap_shared_coherent", coherent, "a=%p b=%p b[0]=0x%02x b[end]=0x%02x",
                     a, b, (unsigned char)b[0], (unsigned char)b[flen - 1]);
              } else {
                  ok("mmap_shared_coherent", 0, "a=%p b=%p errno=%d (%s)", a, b, errno, strerror(errno));
              }

              /* 6. Commit into the reservation: MAP_FIXED of the file over a
                    PROT_NONE range is exactly how ZGC maps a granule. */
              if (biggest != MAP_FAILED && biggest_len >= 2 * MB) {
                  void *c = mmap(biggest, 2 * MB, PROT_READ | PROT_WRITE,
                                 MAP_SHARED | MAP_FIXED, fd, 0);
                  int good = (c == biggest);
                  if (good) {
                      ((char *)c)[0] = 0x11;
                      good = (a != MAP_FAILED) ? ((unsigned char)a[0] == 0x11) : 1;
                  }
                  ok("mapfixed_into_reserve", good, "want=%p got=%p a[0]=0x%02x",
                     biggest, c, (a != MAP_FAILED) ? (unsigned char)a[0] : 0);
              } else {
                  ok("mapfixed_into_reserve", 0, "no reservation to commit into");
              }

              /* 7. Punch-hole uncommit: how ZGC returns memory. The mappings are
                    deliberately left in place while the hole is punched, because
                    that is ZGC's own shape -- it keeps roughly three mappings per
                    granule alive -- so a hole that only gives its pages back once
                    the last mapping is gone would be of no use to it. */
              long free_before = meminfo_free_kb();
              if (a != MAP_FAILED)
                  memset(a, 0x77, flen);            /* fault the whole file in */
              /* ...and have the file itself account for those pages, so that the
                 punch has blocks to free and a pin to release (write_through_fd). */
              int wb = write_through_fd(fd, flen, 0x77);
              long free_touched = meminfo_free_kb();
              struct stat stb;
              long blocks_touched = (fstat(fd, &stb) == 0) ? (long)stb.st_blocks : -1;
              int pr = fallocate(fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, flen);
              long free_after = meminfo_free_kb();
              ok("punch_hole", pr == 0, "rv=%d errno=%d (%s) MemFree kB: start=%ld touched=%ld punched=%ld (reclaimed=%ld)",
                 pr, pr ? errno : 0, pr ? strerror(errno) : "-",
                 free_before, free_touched, free_after, free_after - free_touched);

              /* 7a. The claim under test, measured two ways. st_blocks is the
                     filesystem's own account of the pages it holds, exact and
                     free of noise; MemFree says the physical heap really got them
                     back, and at the punch rather than at the close. (On a Linux
                     host MemFree moves for other reasons and this second one is
                     not meaningful -- inside nanos there is one process and the
                     number is exact.) */
              long blocks_punched = (fstat(fd, &stb) == 0) ? (long)stb.st_blocks : -1;
              ok("punch_hole_frees_blocks",
                 (pr == 0) && (wb == 0) && (blocks_touched > 0) && (blocks_punched == 0),
                 "st_blocks %ld -> %ld across the punch of the whole %luKB file (write+fsync %s)",
                 blocks_touched, blocks_punched, (unsigned long)(flen / 1024),
                 wb ? strerror(wb) : "ok");
              long reclaimed = free_after - free_touched;
              ok("punch_hole_reclaims", (pr == 0) && (reclaimed >= (long)(flen / 1024 / 2)),
                 "reclaimed=%ldkB of the %luKB punched, with the file still mapped",
                 reclaimed, (unsigned long)(flen / 1024));

              /* 7b. The file must still behave like a file: the hole reads back as
                     zeroes, and writing into it again has to fault in fresh pages
                     that both mappings agree on -- the pages that were just freed
                     were freed from under a live mapping. */
              if (pr == 0 && a != MAP_FAILED) {
                  ok("punch_hole_reads_zero", (unsigned char)a[0] == 0x00,
                     "a[0]=0x%02x (Linux re-faults holes as zero)", (unsigned char)a[0]);
                  a[0] = 0x33;
                  a[flen - 1] = 0x44;
                  int refaulted = (b == MAP_FAILED) ||
                      (((unsigned char)b[0] == 0x33) && ((unsigned char)b[flen - 1] == 0x44));
                  ok("punch_hole_refault", refaulted, "b[0]=0x%02x b[end]=0x%02x",
                     (b == MAP_FAILED) ? 0 : (unsigned char)b[0],
                     (b == MAP_FAILED) ? 0 : (unsigned char)b[flen - 1]);
              }

              /* 7c. Where the memory comes back tells the failure apart: a punch
                     that is a no-op, pages pinned by the mappings, or MemFree not
                     accounting for the page cache at all. */
              if (a != MAP_FAILED) munmap(a, flen);
              if (b != MAP_FAILED) munmap(b, flen);
              if (biggest != MAP_FAILED) munmap(biggest, biggest_len);  /* also drops the MAP_FIXED view */
              long free_unmapped = meminfo_free_kb();
              close(fd);
              if (mfd < 0) unlink(path);
              long free_closed = meminfo_free_kb();
              ok("memory_returned", free_closed > free_touched,
                 "MemFree kB: touched=%ld afterPunch=%ld afterUnmap=%ld afterClose=%ld; st_blocks after the punch=%ld",
                 free_touched, free_after, free_unmapped, free_closed, blocks_punched);

              /* 7d. An unaligned hole, which ZGC never punches but the patch must
                     still get right: only whole pages can be given back, so the
                     partial pages at the edges are zeroed in place and nothing
                     outside the hole may be touched. */
              punch_partial_test();

              /* 8. Anonymous shared memory, the other shape of the same need. */
              void *s = mmap(NULL, 2 * MB, PROT_READ | PROT_WRITE,
                             MAP_SHARED | MAP_ANONYMOUS, -1, 0);
              ok("mmap_shared_anon", s != MAP_FAILED, "addr=%p errno=%d (%s)",
                 s, s == MAP_FAILED ? errno : 0, s == MAP_FAILED ? strerror(errno) : "-");

              printf("PROBE DONE\n");
              fflush(stdout);
              return 0;
          }
          EOF
          gcc -O2 -static -Wall -o zgcprobe zgcprobe.c
          file zgcprobe

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build kernel from this ref
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img

      - name: Prime ops nightly cache and swap in our kernel
        run: |
          # ops needs a package pulled once to populate the nightly kernel slot;
          # any package works, the JRE one is already cached across these jobs.
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          cp /tmp/kernel-candidate.img "$OPSK"
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          # Same reason as in the gc-matrix job: the klibs must come from this
          # ref, not from the ones ops ships prebuilt.
          KLIBDIR="$(dirname "$OPSK")/klibs"
          [ -d "$KLIBDIR" ] || { echo "::error::no klibs dir beside $OPSK"; exit 1; }
          for k in tmpfs shmem; do
            built="$(find output -type f -path '*/bin/*' -name "$k" | head -1)"
            [ -n "$built" ] || { echo "::error::klib '$k' was not built under output/"; exit 1; }
            cp "$built" "$KLIBDIR/$k"
            echo "klib $k <- $built"
          done

      - name: Run the probe inside nanos, stock and with the klibs
        run: |
          set -o pipefail
          # -u, or sed block-buffers on a pipe and a guest that hangs shows an
          # empty section instead of the line it stopped on.
          strip_ansi() { sed -u 's/\x1b\[[0-9;]*m//g'; }
          cat > probe-stock.json <<'EOF'
          {
            "RunConfig": { "Memory": "2G" }
          }
          EOF
          cat > probe-klib.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "RunConfig": { "Memory": "2G" }
          }
          EOF
          # Small guest on purpose: 200M punched out of 512M is only reclaimable
          # if the page cache gives it back, so the allocations that follow
          # answer the question instead of the guest simply having room.
          cat > probe-pressure.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["pressure"],
            "RunConfig": { "Memory": "512M" }
          }
          EOF
          for v in stock klib pressure; do
            echo "=== probe (${v}) ==="
            timeout 420 ops run ./zgcprobe --nightly --show-debug --verbose \
              -c "probe-${v}.json" 2>&1 | strip_ansi | tee "probe-${v}.log" || true
            if ! grep -q '^PROBE ' "probe-${v}.log"; then
              echo "--- retry without --show-debug/--verbose (ops flag differences) ---"
              timeout 420 ops run ./zgcprobe --nightly -c "probe-${v}.json" 2>&1 \
                | strip_ansi | tee "probe-${v}.log" || true
            fi
          done

      - name: Report the stock-vs-klib capability matrix
        run: |
          res() { # $1=variant $2=check -> "VERDICT detail"
            grep "^PROBE $2 " "probe-$1.log" 2>/dev/null | head -1 | sed -E 's/^PROBE +[^ ]+ +//'
          }
          checks=$(cat probe-stock.log probe-klib.log 2>/dev/null \
                   | grep '^PROBE ' | grep -v '^PROBE DONE' | awk '{print $2}' | awk '!seen[$0]++')
          echo "--- stock ---"; grep '^PROBE' probe-stock.log || true
          echo "--- klib  ---"; grep '^PROBE' probe-klib.log  || true
          {
            echo "## ZGC backing-store primitives, measured inside nanos"
            echo ""
            echo "| check | stock image | + tmpfs/shmem klibs |"
            echo "|---|---|---|"
            for c in $checks; do
              echo "| \`$c\` | $(res stock "$c" | cut -c1-90) | $(res klib "$c" | cut -c1-90) |"
            done
            echo ""
            echo "With the klibs, \`memfd_create\` succeeds and the remaining checks run against the memfd itself"
            echo "(the tmpfs klib's pages) instead of a file on the root filesystem — which is the path ZGC takes."
            echo "\`punch_hole_reclaims\` is the claim of the uncommit change: the pages come back at the punch,"
            echo "with the file still mapped, rather than only when it is closed (\`memory_returned\`)."
            echo "It is expected to fail on the stock column, where the root filesystem has no dealloc method"
            echo "and keeps the previous zero-in-place behaviour."
            echo ""
            echo "### Under memory pressure (512M guest, 200M punched out of a memfd)"
            echo ""
            echo "Does a punched hole give its pages back, and can the guest then use them for something else?"
            echo '```'
            grep -E '^(PRESSURE|PROBE (pressure_alloc|punch_frees_pagecache|pressure_setup))' probe-pressure.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for v in stock klib; do
            grep -q '^PROBE DONE' "probe-${v}.log" || {
              echo "::error::probe (${v}) did not reach the end — it crashed or never booted; see probe-${v}.log"; fail=1; }
          done
          # The claim under test: the klib actually delivers the syscall.
          if grep -q '^PROBE memfd_create *PASS' probe-klib.log; then
            echo "PASS: memfd_create works once the shmem klib is loaded"
          else
            echo "::error::memfd_create still fails with the klibs loaded: $(res klib memfd_create)"
            fail=1
          fi

          # What the uncommit change has to deliver, on the memfd path only: the
          # root filesystem has no dealloc method and is expected to keep zeroing
          # its pages in place, so the stock column is left as the contrast.
          for c in punch_hole_frees_blocks punch_hole_reclaims punch_hole_refault punch_partial punch_partial_blocks; do
            if grep -q "^PROBE ${c} *PASS" probe-klib.log; then
              echo "PASS: ${c}"
            else
              echo "::error::${c} failed on the memfd: $(res klib "$c")"
              fail=1
            fi
          done

          echo "--- pressure ---"; grep -E '^(PRESSURE|PROBE p)' probe-pressure.log || true
          if ! grep -q '^PRESSURE baseline' probe-pressure.log; then
            echo "::error::the pressure run produced no measurement — see probe-pressure.log"
            fail=1
          else
            # A guest that runs out of memory here truncates its own log, so a
            # missing result counts as a failure just like an explicit one.
            for c in punch_frees_pagecache pressure_alloc; do
              if grep -q "^PROBE ${c} *PASS" probe-pressure.log; then
                echo "PASS: ${c}"
              else
                echo "::error::${c} did not pass under pressure: $(res pressure "$c")"
                fail=1
              fi
            done
          fi
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgc-backing-store-probe
          path: |
            zgcprobe.c
            probe-stock.log
            probe-klib.log
            probe-pressure.log
            probe-*.json

  # ====================================================================
  # nanos's own runtime test for memfd, extended with the fallocate cases the
  # dispatch change makes reachable (allocate and keep-size on a memfd, and the
  # seals they have to honour). Running it through `make run-noaccel` builds the
  # image the way the upstream suite does -- its manifest already loads the
  # tmpfs and shmem klibs, and both are built from this ref -- so this is the
  # patch under nanos, not under Linux.
  # ====================================================================
  runtime-test-shmem:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-aarch64

      - name: Run the upstream shmem runtime test under TCG
        run: |
          set -o pipefail
          # Build the image separately from booting it: a build error has to
          # fail this step loudly, while the qemu exit status must be tolerated
          # (the guest exits through the debug-exit device, not with 0).
          make -j"$(nproc)" image TARGET=shmem PLATFORM=virt 2>&1 | tail -30
          ls -l output/test/runtime/bin/shmem output/image/disk.raw
          timeout 900 make run-noaccel TARGET=shmem PLATFORM=virt 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee shmem-test.log || true
          echo "--- output del guest, ultime righe ---"
          tail -5 shmem-test.log

      - name: Assert the test passed inside the guest
        run: |
          if grep -qE 'failed at|Error: ' shmem-test.log; then
            echo "::error::shmem runtime test failed inside nanos:"
            grep -E 'failed at|Error: ' shmem-test.log | head -5
            exit 1
          fi
          grep -q 'Shared memory tests OK' shmem-test.log || {
            echo "::error::shmem runtime test did not report success — see shmem-test.log"
            tail -20 shmem-test.log
            exit 1; }
          echo "PASS: $(grep 'Shared memory tests OK' shmem-test.log | head -1)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shmem-runtime-test
          path: shmem-test.log
