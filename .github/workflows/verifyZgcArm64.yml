name: ZGC on nanos — GC matrix + backing-store probe (arm64 + x86_64)

# ZGC is the one GC that does not start in a stock nanos image: it needs a
# shared memory FILE to back the heap, and asks for one via memfd_create(2),
# whose handler lives in the *shmem klib* (klib/shmem.c: a tmpfs instance plus
# swap_syscall_handler) rather than in the base kernel. An image built without
# that klib gets ENOSYS, and ZGC's only fallback -- a file on a filesystem whose
# statfs f_type is TMPFS_MAGIC -- is closed too, because statfs_internal() never
# fills f_type in.
#
# Loading the klib is necessary but was not sufficient: ZGC then obtained its
# heap backing file and died committing memory into it, because fallocate() was
# implemented by tfs alone and returned EINVAL on a tmpfs file. That is fixed
# upstream ("fs: dispatch fallocate() through the filesystem"), and the other
# half of the pair is on this ref: punching a hole zeroed the pages and kept
# them, so the memory only came back when the file was closed and a process
# could be killed for memory it had already released ("fs: give back the pages
# of a punched hole on tmpfs"). Both live partly in the tmpfs klib -- which is
# why the steps below install the klibs built here over the prebuilt ones ops
# ships. Everything else ZGC needs already worked (huge PROT_NONE reservations,
# MAP_FIXED commit, MADV_DONTNEED, punch-hole).
#
# The first two jobs run stock-vs-klib on the kernel built from THIS ref:
#   * job "gc-matrix"      - boots a real allocation workload under every GC the
#                            JRE ships. G1/Serial/Parallel are the control and
#                            are gated; ZGC runs twice, without the klib (must
#                            fail on the backing file) and with it (must start).
#   * job "backing-store"  - a C probe running INSIDE nanos that exercises the
#                            exact primitives ZGC's backing store is built from
#                            (memfd, statfs magic, huge PROT_NONE reservation,
#                            MAP_SHARED multi-mapping + coherency, MAP_FIXED
#                            commit into the reservation, and punch-hole
#                            uncommit: whether the pages come back at the punch
#                            with the file still mapped, whether the hole still
#                            reads and re-faults as a hole, and what an
#                            unaligned hole does to the pages at its edges),
#                            once without the klib and once with it.
#
#   * job "runtime-test-shmem" - nanos's own memfd runtime test, which the same
#                            change extends with the fallocate and sealing
#                            cases, run through the upstream `make run-noaccel`
#                            harness so the assertions are checked against nanos
#                            rather than against Linux.
#
# The klib names are the ones ops ships (~/.ops/<ver>/klibs/{tmpfs,shmem}), but
# the binaries installed here are built from this ref; nanos's own
# test/runtime/shmem.c covers the same multi-mapping pattern ZGC relies on, so
# this is exercising a supported path, not a hack.
#
# TCG on the free hosted arm64 runner is enough — nothing here needs KVM.
# (GitHub-hosted arm64 runners do NOT expose /dev/kvm.)
#
# The backing-store job runs on BOTH architectures, and the second one is not a
# formality. nanos only sees a mapping's pages as dirty on x86_64 -- aarch64's
# pte_is_dirty() is a stub (src/aarch64/page_machine.h) while x86_64 reads the
# hardware bit (src/x86_64/page_machine.h) -- so there, and only there, a page
# written through a mapping is written back on its own: tmpfsfile_write() is
# called from under the page cache node's spin lock and asks for the
# filesystem's mutex, which is the half of the lock cycle this change had to
# close from the other side. On aarch64 that path opens only because the probe
# writes through the fd on purpose; on x86_64 it opens by itself, and the
# uncommit had never run there.

on:
  push:
    branches: [ci/zgc-probe]
    paths:
      - 'src/**'
      - 'klib/**'
      - 'test/runtime/shmem.c'
      - '.github/workflows/verifyZgcArm64.yml'
  workflow_dispatch:
    inputs:
      jre_package:
        description: "HotSpot JRE ops package"
        default: "AngeloRubens/TemurinJREarm64Linux:25.0.1"
      zgc_expect:
        description: "gate ZGC-with-klib (default) or only measure it"
        default: "must-start"
        type: choice
        options: [must-start, report]

env:
  JRE_PACKAGE: ${{ inputs.jre_package || 'AngeloRubens/TemurinJREarm64Linux:25.0.1' }}
  ZGC_EXPECT: ${{ inputs.zgc_expect || 'must-start' }}

jobs:
  # ====================================================================
  # Which garbage collectors actually run inside nanos? Each GC gets its own
  # boot of the same self-verifying allocation workload, so the answer is
  # "the GC completed a real collection", not merely "the VM initialized".
  # ====================================================================
  gc-matrix:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          # ops's get.sh gates on `which qemu-system-x86_64` even on arm64, so
          # the qemu-system metapackage (pulls qemu-system-x86) is required just
          # to satisfy that check; qemu-system-arm/aarch64 actually boot the
          # arm64 guest. Mirrors the known-good verifyCpuinfoArm64 job.
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Set up a JDK to compile the workload
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile GcChurn (forces real collections, then self-checks)
        run: |
          cat > GcChurn.java <<'EOF'
          import java.util.ArrayList;
          import java.util.List;

          /* Allocates several times the heap so the collector must actually run,
             while keeping a live set that is checked at the end: a GC that
             corrupts or drops a live object shows up as MISMATCH, not as a
             silent pass. Kept small on purpose — this boots under TCG. */
          public class GcChurn {
              static long fnv(byte[] b) {
                  long h = 0xcbf29ce484222325L;
                  for (byte v : b) { h ^= (v & 0xff); h *= 0x100000001b3L; }
                  return h;
              }
              public static void main(String[] args) throws Exception {
                  final int liveCount = 64, liveSize = 512 * 1024;
                  final int rounds = Integer.getInteger("rounds", 12);
                  /* Objects above ZObjectSizeLimitMedium go into ZGC "large"
                     pages, committed as granule multiples of an arbitrary
                     size — a different allocation path from the medium pages
                     the 512K arrays of the live set land in. */
                  final int humongous = Integer.getInteger("humongous", 0);
                  final int humongousMB = Integer.getInteger("humongousMB", 32);
                  /* Seconds to idle at the end, after dropping the live set, so
                     ZGC's uncommitter has something to give back and the time
                     to do it (needs -Xms < -Xmx and a short ZUncommitDelay). */
                  final int settle = Integer.getInteger("settle", 0);
                  List<byte[]> live = new ArrayList<>(liveCount);
                  long expect = 0;
                  for (int i = 0; i < liveCount; i++) {
                      byte[] a = new byte[liveSize];
                      for (int j = 0; j < a.length; j += 997) a[j] = (byte) (i + j);
                      live.add(a);
                      expect ^= fnv(a);
                  }
                  /* Checked by sentinels rather than by hashing: under TCG,
                     walking hundreds of MB byte by byte is the slow part. */
                  List<byte[]> big = new ArrayList<>(humongous);
                  for (int i = 0; i < humongous; i++) {
                      byte[] a = new byte[humongousMB * 1024 * 1024];
                      a[0] = (byte) (i + 1);
                      a[a.length / 2] = (byte) (i + 2);
                      a[a.length - 1] = (byte) (i + 3);
                      big.add(a);
                  }
                  long sink = 0;
                  for (int r = 0; r < rounds; r++) {
                      for (int i = 0; i < 16; i++) {           /* garbage */
                          byte[] tmp = new byte[512 * 1024];
                          tmp[0] = (byte) r; tmp[tmp.length - 1] = (byte) i;
                          sink += tmp[0] + tmp[tmp.length - 1];
                      }
                      System.gc();                              /* and an explicit one */
                  }
                  long actual = 0;
                  for (byte[] a : live) actual ^= fnv(a);
                  boolean ok = (actual == expect);
                  if (!ok) System.out.println("LIVE SET MISMATCH");
                  for (int i = 0; i < big.size(); i++) {
                      byte[] a = big.get(i);
                      if ((a[0] != (byte) (i + 1)) || (a[a.length / 2] != (byte) (i + 2))
                              || (a[a.length - 1] != (byte) (i + 3))) {
                          ok = false;
                          System.out.println("HUMONGOUS MISMATCH at " + i);
                      }
                  }
                  if (settle > 0) {
                      live.clear();
                      big.clear();
                      for (int i = 0; i < settle; i++) { System.gc(); Thread.sleep(1000); }
                  }
                  System.out.println("GC " + (ok ? "OK" : "FAIL")
                          + " collector=" + gcNames()
                          + " maxHeap=" + (Runtime.getRuntime().maxMemory() >> 20) + "m"
                          + " sink=" + sink);
              }
              static String gcNames() {
                  StringBuilder sb = new StringBuilder();
                  for (java.lang.management.GarbageCollectorMXBean b :
                          java.lang.management.ManagementFactory.getGarbageCollectorMXBeans()) {
                      if (sb.length() > 0) sb.append('+');
                      sb.append(b.getName().replace(' ', '_')).append('(').append(b.getCollectionCount()).append(')');
                  }
                  return sb.length() == 0 ? "none" : sb.toString();
              }
          }
          EOF
          javac --release 11 -d . GcChurn.java
          ls -l GcChurn.class

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build kernel from this ref
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Prime ops nightly cache and swap in our kernel
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "ops kernel slot: $OPSK"
          cp /tmp/kernel-candidate.img "$OPSK"
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          # Part of the fix lives in the tmpfs klib, so the image has to load the
          # klibs built from this ref: leaving ops's prebuilt ones in place would
          # quietly test stock nanos and make a green run meaningless.
          KLIBDIR="$(dirname "$OPSK")/klibs"
          [ -d "$KLIBDIR" ] || { echo "::error::no klibs dir beside $OPSK"; exit 1; }
          for k in tmpfs shmem; do
            built="$(find output -type f -path '*/bin/*' -name "$k" | head -1)"
            [ -n "$built" ] || { echo "::error::klib '$k' was not built under output/"; exit 1; }
            cp "$built" "$KLIBDIR/$k"
            echo "klib $k <- $built"
          done

      - name: Boot the workload once per GC
        run: |
          set -o pipefail
          # -u, or sed block-buffers on a pipe and a guest that hangs shows an
          # empty section instead of the line it stopped on.
          strip_ansi() { sed -u 's/\x1b\[[0-9;]*m//g'; }
          # label|flag|klibs — Shenandoah may simply not be in this build, which
          # the log will say ("Unrecognized VM option"); that is a JRE fact, not
          # a nanos one, and is reported as such. ZGC runs twice: the stock
          # image has no memfd_create, the second one asks ops for the klibs
          # that provide it (tmpfs is listed explicitly because shmem's
          # tmpfs_new() resolves against it, exactly as test/runtime/shmem.manifest
          # does upstream).
          # label|flag|klibs|extra args (appended last, so they override the
          # defaults). The last two entries exist because heap size alone only
          # repeats the same code: what changes the path taken is the object
          # size (large pages) and -Xms < -Xmx (uncommit, i.e. the JVM punching
          # holes in the memfd rather than only committing).
          MATRIX=(
            "g1|UseG1GC||"
            "serial|UseSerialGC||"
            "parallel|UseParallelGC||"
            "shenandoah|UseShenandoahGC||"
            "z|UseZGC||"
            "z-shmem|UseZGC|\"tmpfs\", \"shmem\"|"
            "z-large|UseZGC|\"tmpfs\", \"shmem\"|\"-Xmx512m\", \"-Dhumongous=4\", \"-DhumongousMB=32\", \"-Drounds=6\","
            "z-uncommit|UseZGC|\"tmpfs\", \"shmem\"|\"-Xms64m\", \"-Xmx512m\", \"-XX:ZUncommitDelay=1\", \"-Xlog:gc+heap\", \"-Drounds=8\", \"-Dsettle=8\","
          )
          for entry in "${MATRIX[@]}"; do
            label="$(echo "$entry" | cut -d'|' -f1)"
            flag="$(echo "$entry" | cut -d'|' -f2)"
            klibs="$(echo "$entry" | cut -d'|' -f3)"
            extra="$(echo "$entry" | cut -d'|' -f4)"
            [ -n "$klibs" ] && klibline="  \"Klibs\": [${klibs}]," || klibline=""
            cat > "cfg-${label}.json" <<EOF
          {
          ${klibline}
            "Args": ["-XX:+${flag}", "-Xlog:gc+init=debug", "-Xlog:gc", "-Xms192m", "-Xmx192m",
                     "-Drounds=12", ${extra} "-cp", "/", "GcChurn"],
            "Files": ["GcChurn.class"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
            echo "=== ${label} (-XX:+${flag}) ==="
            timeout 600 ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
              --show-debug --verbose -c "cfg-${label}.json" 2>&1 \
              | strip_ansi | tee "gc-${label}.log" || true
          done

      - name: Gate the control GCs and ZGC-with-klib, report the rest
        run: |
          verdict() { # $1=logfile -> OK | FAIL | ABSENT
            if grep -q 'GC OK' "$1" 2>/dev/null; then echo OK
            elif grep -qi 'Unrecognized VM option' "$1" 2>/dev/null; then echo ABSENT
            else echo FAIL; fi
          }
          reason() { # the most specific line that explains a non-start
            # Ordered: the specific cause first, the generic "initialization
            # failed" banner only as a last resort — HotSpot prints the banner
            # BEFORE the detail, so a plain head -1 would always report the
            # useless line and misclassify a known gap as unexpected.
            # ops dumps the image manifest before booting, and that dump now
            # contains the klib names ("tmpfs", "shmem") and the whole java
            # command line, so it has to be dropped or it matches every pattern.
            local src
            src=$(grep -vE '^\s*&\{root:|^Manifest:' "$1" 2>/dev/null)
            for pat in 'memfd|tmpfs|hugetlbfs|AllocateHeapAt|backing file' \
                       'Unrecognized VM option' \
                       'Failed to|Could not|Not enough space|out of memory' \
                       'Error occurred during initialization'; do
              m=$(printf '%s\n' "$src" | grep -iE "$pat" | head -1 | cut -c1-160)
              [ -n "$m" ] && { echo "$m"; return; }
            done
          }
          {
            echo "## GC matrix inside nanos (arm64, TCG, kernel from this ref)"
            echo ""
            echo "| GC | image | result | collectors / reason |"
            echo "|---|---|---|---|"
            for l in g1 serial parallel shenandoah z z-shmem z-large z-uncommit; do
              v=$(verdict "gc-${l}.log")
              if [ "$v" = OK ]; then
                d=$(grep -o 'collector=[^ ]*' "gc-${l}.log" | head -1)
              else
                d=$(reason "gc-${l}.log")
              fi
              case "$l" in
                z-shmem)    img="+ klibs" ;;
                z-large)    img="+ klibs, 32M objects (large pages)" ;;
                z-uncommit) img="+ klibs, -Xms64m/-Xmx512m (uncommit on)" ;;
                *)          img="stock" ;;
              esac
              echo "| \`$l\` | $img | **$v** | ${d:-–} |"
            done
            echo ""
            echo "ZGC uncommit evidence (\`zUncommitter.cpp\` logs this only when it actually gives memory back):"
            echo '```'
            ev=$(grep -E 'Uncommitter|Uncommit:' gc-z-uncommit.log 2>/dev/null | head -5 || true)
            echo "${ev:-(none reported)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for l in g1 serial parallel; do          # control: these must work
            v=$(verdict "gc-${l}.log")
            echo "$l: $v"
            [ "$v" = OK ] || { echo "::error::${l} did not complete the workload — regression, see gc-${l}.log"; fail=1; }
          done

          # Stock image: ZGC is expected NOT to start, and specifically because
          # the backing file could not be created. Anything else means the story
          # in this file's header is wrong and needs re-reading.
          zv=$(verdict gc-z.log)
          zr=$(reason gc-z.log)
          echo "zgc (stock): $zv  reason: $zr"
          if [ "$zv" = OK ]; then
            echo "::warning::ZGC started WITHOUT the shmem klib — memfd_create is available in the base kernel now; update this workflow's premise"
          elif ! printf '%s' "$zr" | grep -qiE 'memfd|tmpfs|hugetlbfs|AllocateHeapAt|backing'; then
            echo "::warning::ZGC failed for an UNEXPECTED reason (not the backing-file gap): ${zr:-<none found>} — inspect gc-z.log"
          fi

          # With the klib the JVM must actually run: this is the claim.
          kv=$(verdict gc-z-shmem.log)
          echo "zgc (+klib): $kv  $(grep -o 'collector=[^ ]*' gc-z-shmem.log | head -1)"
          if [ "$kv" != OK ]; then
            msg="ZGC still does not complete with the tmpfs/shmem klibs loaded: $(reason gc-z-shmem.log)"
            if [ "$ZGC_EXPECT" = "must-start" ]; then
              echo "::error::$msg"; fail=1
            else
              echo "::warning::$msg"
            fi
          else
            echo "PASS: ZGC runs on nanos once the shmem klib provides memfd_create"
          fi

          # Large pages: objects above ZObjectSizeLimitMedium are committed as
          # whole granule multiples, a different size class from the medium
          # pages the base workload uses.
          lv=$(verdict gc-z-large.log)
          echo "zgc (+klib, large pages): $lv"
          if [ "$lv" != OK ]; then
            echo "::error::ZGC fails with humongous objects: $(reason gc-z-large.log)"
            fail=1
          fi

          # Uncommit: the only configuration where the JVM punches holes in the
          # memfd instead of only committing. Gated on the workload completing;
          # whether the uncommitter fired is reported, since it depends on
          # timing rather than on correctness.
          uv=$(verdict gc-z-uncommit.log)
          echo "zgc (+klib, uncommit): $uv"
          if [ "$uv" != OK ]; then
            echo "::error::ZGC fails with an elastic heap: $(reason gc-z-uncommit.log)"
            fail=1
          fi
          if grep -qE 'Uncommitter.*Uncommitted:' gc-z-uncommit.log 2>/dev/null; then
            echo "PASS: ZGC uncommitted memory through the memfd: $(grep -oE 'Uncommitter.*' gc-z-uncommit.log | head -1)"
          else
            echo "::warning::the uncommitter never reported giving memory back — the path stayed untested in this run (delay too long, or nothing was uncommittable)"
          fi

          sv=$(verdict gc-shenandoah.log)
          echo "shenandoah: $sv $( [ "$sv" = ABSENT ] && echo '(not built into this JRE)' )"
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-matrix-logs
          path: |
            GcChurn.java
            gc-*.log
            cfg-*.json

  # ====================================================================
  # What exactly would a memfd_create patch have to provide? Rather than
  # inferring it from ZGC's failure message, run a C probe INSIDE nanos that
  # calls the same primitives ZPhysicalMemoryBacking uses, one at a time, and
  # prints a PASS/FAIL line for each. The interesting one is #5: whether two
  # MAP_SHARED mappings of the same file are coherent — that is the property a
  # memfd implementation has to deliver, and the thing that decides whether the
  # patch is small or structural.
  # ====================================================================
  backing-store:
    # Both architectures run the same probe against the same change. The package
    # is only there to make ops populate its nightly kernel slot, which is then
    # overwritten with the kernel built here, so any package of the right
    # architecture would do.
    strategy:
      fail-fast: false      # one architecture failing must not hide the other
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: virt
            ops_arch: arm64
            package: "AngeloRubens/TemurinJREarm64Linux:25.0.1"
          - arch: x64
            runner: ubuntu-24.04
            platform: pc
            ops_arch: amd64
            package: "AngeloRubens/AzulJREx64Linux:25.0.1"
    name: backing-store (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          # nasm is the pc platform's assembler (rules.mk: AS = nasm), so the
          # x86_64 kernel does not build without it.
          sudo apt-get install -y build-essential binutils wget git python3 nasm gdb \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Build the probe (static, so the image needs no libs)
        run: |
          cat > zgcprobe.c <<'EOF'
          /* Exercises, inside nanos, the primitives ZGC's Linux backing store is
             built from. Every check prints "PROBE <name> <PASS|FAIL> <detail>";
             nothing aborts, so one missing piece does not hide the others. */
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <stdarg.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/statfs.h>
          #include <sys/syscall.h>

          #ifndef MFD_CLOEXEC
          #define MFD_CLOEXEC 0x0001U
          #endif
          #ifndef FALLOC_FL_KEEP_SIZE
          #define FALLOC_FL_KEEP_SIZE 0x01
          #endif
          #ifndef FALLOC_FL_PUNCH_HOLE
          #define FALLOC_FL_PUNCH_HOLE 0x02
          #endif
          #define TMPFS_MAGIC     0x01021994
          #define HUGETLBFS_MAGIC 0x958458f6

          #define MB (1024UL * 1024UL)
          #define GB (1024UL * MB)

          static void ok(const char *name, int pass, const char *fmt, ...)
          {
              va_list ap; va_start(ap, fmt);
              printf("PROBE %-22s %s ", name, pass ? "PASS" : "FAIL");
              vprintf(fmt, ap);
              printf("\n");
              fflush(stdout);
              va_end(ap);
          }

          /* A check that could not run is not a check that failed. The stock image has no
             memfd_create at all, and its root filesystem is smaller than some of the files these
             want, so without this the column reads as a row of failures that measured nothing and
             the two that are the actual contrast get lost among them. A skip is not a pass
             either: the gates ask for PASS, so a prerequisite going missing where it is supposed
             to be there still fails. */
          static void skip(const char *name, const char *fmt, ...)
          {
              va_list ap; va_start(ap, fmt);
              printf("PROBE %-22s SKIP ", name);
              vprintf(fmt, ap);
              printf("\n");
              fflush(stdout);
              va_end(ap);
          }

          /* Makes the file account for the pages it holds. Writing through a
             mapping is not enough on aarch64: nanos never sees a mapping's pages
             as dirty there (pte_is_dirty() is a stub -- src/aarch64/page_machine.h,
             "hardware management of dirty pages" unavailable under qemu), so an
             msync writes nothing back, tmpfs is never asked to record the range,
             and the file reports zero blocks however much has been written into
             it. The write(2) path marks the pages dirty without going through the
             PTE bit, and the fsync makes tmpfs account for the range and pin it --
             which is the state a punched hole has to undo. */
          static int write_through_fd(int fd, unsigned long len, unsigned char v)
          {
              static char buf[64 * 1024];
              memset(buf, v, sizeof(buf));
              for (unsigned long off = 0; off < len; ) {
                  unsigned long n = len - off;
                  if (n > sizeof(buf))
                      n = sizeof(buf);
                  ssize_t w = pwrite(fd, buf, n, (off_t)off);
                  if (w <= 0)
                      return errno;   /* 0 on success, the errno otherwise */
                  off += (unsigned long)w;
              }
              return (fsync(fd) == 0) ? 0 : errno;
          }

          static long meminfo_free_kb(void)
          {
              FILE *f = fopen("/proc/meminfo", "r");
              char line[256];
              long v = -1;
              if (!f)
                  return -1;
              while (fgets(line, sizeof(line), f))
                  if (sscanf(line, "MemFree: %ld kB", &v) == 1)
                      break;
              fclose(f);
              return v;
          }

          /* MemFree counts the physical heap; Cached is what the page cache
             holds. A punched hole that only zeroes its pages shows up as
             neither being given back — the point of the pressure test is to
             find out whether they come back when someone else needs them. */
          static void meminfo2(long *freekb, long *cachedkb)
          {
              FILE *f = fopen("/proc/meminfo", "r");
              char line[256];
              *freekb = *cachedkb = -1;
              if (!f)
                  return;
              while (fgets(line, sizeof(line), f)) {
                  sscanf(line, "MemFree: %ld kB", freekb);
                  sscanf(line, "Cached: %ld kB", cachedkb);
              }
              fclose(f);
          }

          #define PRESS_FILL  (200 * MB)
          #define PRESS_CHUNK (8 * MB)
          #define PRESS_FLOOR (64 * MB)   /* stop asking for memory here */

          static void pressure_test(void)
          {
              long f0, c0, f1, c1, f2, c2, f3, c3;
              meminfo2(&f0, &c0);
              printf("PRESSURE baseline           MemFree=%ldkB Cached=%ldkB\n", f0, c0);
              fflush(stdout);

              long fd = syscall(SYS_memfd_create, "pressure", 0);
              if (fd < 0) {
                  ok("pressure_setup", 0, "memfd_create errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              if ((ftruncate((int)fd, PRESS_FILL) != 0)) {
                  ok("pressure_setup", 0, "ftruncate errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              char *m = mmap(NULL, PRESS_FILL, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("pressure_setup", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              memset(m, 0x5a, PRESS_FILL);          /* materialise every page */
              meminfo2(&f1, &c1);
              printf("PRESSURE filled %luM         MemFree=%ldkB Cached=%ldkB\n",
                     (unsigned long)(PRESS_FILL / MB), f1, c1);
              fflush(stdout);

              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, PRESS_FILL);
              munmap(m, PRESS_FILL);
              meminfo2(&f2, &c2);
              printf("PRESSURE punched+unmapped   MemFree=%ldkB Cached=%ldkB (punch rv=%d)\n",
                     f2, c2, pr);
              fflush(stdout);

              /* Ask for more memory than was free before the punch, without ever
                 releasing it: anything allocated beyond that can only come from
                 the pages the hole gave back. Stop at a floor rather than at
                 exhaustion -- a guest that runs out does not get ENOMEM from
                 mmap, it dies in allocate_table_page() (src/kernel/page.c), which
                 wants a contiguous 1M chunk and cannot find one once the physical
                 heap is chopped up by 4K anonymous pages -- and a dead guest
                 takes the verdict down with it. */
              unsigned long target = (unsigned long)f1 * 1024 + PRESS_FILL / 4;
              unsigned long got = 0;
              long f = f2, c;
              while ((got < target) && (f > (long)(PRESS_FLOOR / 1024))) {
                  char *a = mmap(NULL, PRESS_CHUNK, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (a == MAP_FAILED) {
                      printf("PRESSURE mmap failed after %luM errno=%d (%s)\n",
                             got / MB, errno, strerror(errno));
                      break;
                  }
                  memset(a, 0xa5, PRESS_CHUNK);
                  got += PRESS_CHUNK;
                  meminfo2(&f, &c);
                  if ((got % (40 * MB)) == 0) {
                      printf("PRESSURE touched %3luM       MemFree=%ldkB Cached=%ldkB\n",
                             got / MB, f, c);
                      fflush(stdout);
                  }
              }
              meminfo2(&f3, &c3);
              printf("PRESSURE stopped at %luM     MemFree=%ldkB (target %luM, floor %luM)\n",
                     got / MB, f3, target / MB, (unsigned long)(PRESS_FLOOR / MB));
              fflush(stdout);
              /* The gate is the memory that was free before the punch, not the
                 size of the hole: 200M would have been allocatable out of the
                 274M that were free anyway, so it would pass without the pages
                 ever coming back. */
              ok("pressure_alloc", got > (unsigned long)f1 * 1024,
                 "allocated %luM after punching %luM (free before the punch: %ldkB, after: %ldkB)",
                 got / MB, (unsigned long)(PRESS_FILL / MB), f1, f2);
              /* The page cache has to shrink at the punch itself. Before this
                 patch it did not shrink at all: the pages stayed dirty and
                 pinned, and no amount of pressure could take them back. */
              ok("punch_frees_pagecache", c2 < c1 - (long)(PRESS_FILL / 1024 / 2),
                 "Cached %ldkB -> %ldkB at the punch (MemFree %ldkB -> %ldkB), then %ldkB under pressure",
                 c1, c2, f1, f2, c3);
              close((int)fd);
          }

          /* An unaligned hole. Only whole pages can be handed back, so the pages
             the hole starts and ends in are zeroed in place instead; nothing
             outside the hole may change, and the file's own account of the pages
             it holds (st_blocks) has to follow. */
          static void punch_partial_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = 16 * ps;
              long fd = syscall(SYS_memfd_create, "partial", 0);
              if (fd < 0) {
                  skip("punch_partial", "no memfd_create: errno=%d (%s)", errno, strerror(errno));
                  skip("punch_partial_blocks", "no memfd_create");
                  return;
              }
              if (ftruncate((int)fd, len) != 0) {
                  ok("punch_partial", 0, "ftruncate errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              char *m = mmap(NULL, len, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("punch_partial", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              memset(m, 0xee, len);
              int wb = write_through_fd((int)fd, len, 0xee);   /* so that the file
                                           has blocks to lose; see write_through_fd */
              struct stat before, after;
              fstat((int)fd, &before);

              /* Half a page in, half a page short of the end: pages 2 and 13 are
                 partial, pages 3..12 are whole and can be freed. */
              unsigned long hs = 2 * ps + ps / 2, he = 14 * ps - ps / 2;
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                 (long)hs, (long)(he - hs));
              fstat((int)fd, &after);
              int outside_intact = ((unsigned char)m[hs - 1] == 0xee) &&
                                   ((unsigned char)m[0] == 0xee) &&
                                   ((unsigned char)m[he] == 0xee) &&
                                   ((unsigned char)m[len - 1] == 0xee);
              int inside_zero = ((unsigned char)m[hs] == 0x00) &&
                                ((unsigned char)m[3 * ps] == 0x00) &&
                                ((unsigned char)m[he - 1] == 0x00);
              ok("punch_partial", (pr == 0) && outside_intact && inside_zero,
                 "rv=%d errno=%d hole=[0x%lx,0x%lx) outside_intact=%d inside_zero=%d "
                 "(m[hs-1]=0x%02x m[hs]=0x%02x m[he-1]=0x%02x m[he]=0x%02x)",
                 pr, pr ? errno : 0, hs, he, outside_intact, inside_zero,
                 (unsigned char)m[hs - 1], (unsigned char)m[hs],
                 (unsigned char)m[he - 1], (unsigned char)m[he]);
              if (wb != 0)
                  /* Nothing was accounted for, so there is nothing to watch being given back. */
                  skip("punch_partial_blocks", "the file could not be written through the fd: %s",
                       strerror(wb));
              else
                  ok("punch_partial_blocks",
                     (before.st_blocks > 0) && (after.st_blocks < before.st_blocks),
                     "st_blocks %ld -> %ld for a %lu-page hole in a %lu-page file",
                     (long)before.st_blocks, (long)after.st_blocks, (he - hs) / ps, len / ps);
              munmap(m, len);
              close((int)fd);
          }

          /* Punching while the pages are being faulted in, which is the shape of ZGC's own
             uncommitter running beside the mutator threads, and the one case the punch cannot test
             sequentially: a page still referenced when the hole reaches it must be zeroed instead
             of freed. Each page carries a marker byte derived from its index, so a page can only
             ever read back as its own marker (someone wrote it) or as zero (the hole took it) --
             any other value is a page that ended up somewhere it does not belong. A byte is used
             on purpose: a wider marker could be caught half-zeroed by a racing punch. */
          #define CONC_LEN      (16 * MB)
          #define CONC_TOUCHERS 3
          #define CONC_PUNCHERS 2       /* the most there can be; how many there are is an argument */
          #define CONC_PUNCHES  150
          #define CONC_SECONDS  120       /* well inside the step's own timeout */

          static char *conc_a, *conc_b;
          static int conc_fd;
          static unsigned long conc_ps, conc_pages;
          static volatile int conc_stop, conc_punchers_left;
          /* Which of the two things that could leave a pin behind is present, so that a run can
             have one without the other: punches that overlap each other, and write-back putting
             a range back in the file's map while a punch is taking it out. */
          static int conc_punchers = CONC_PUNCHERS, conc_writers = 1;
          static volatile unsigned long conc_bad, conc_touches;
          static volatile unsigned long conc_writes, conc_werr;
          static volatile long conc_blocks_max;
          /* One counter per puncher rather than one shared: they are read by the gate, and two
             threads incrementing the same one would lose counts and make it fail for a reason
             that has nothing to do with the punch. */
          static volatile unsigned long conc_done[CONC_PUNCHERS];
          /* Which punch each puncher is inside, one-based so that zero means "between two", and
             when it entered it. Read by the watchdog below. */
          static volatile unsigned long conc_inpunch[CONC_PUNCHERS];
          static volatile long conc_since[CONC_PUNCHERS];

          static unsigned long conc_punched(void)
          {
              unsigned long n = 0;
              for (int i = 0; i < conc_punchers; i++)
                  n += conc_done[i];
              return n;
          }

          /* A run that stops in the middle of the race says almost nothing on its own: the last
             line is a punch that was announced and never came back, which looks the same whether
             one thread is stuck in that punch or the whole guest has stopped. This thread does
             nothing but say, once a second, who is still moving -- so silence from it means the
             guest itself is gone, while a beat that keeps coming while the touch count stands
             still means the threads faulting pages are blocked on something a punch holds. */
          static void *conc_watchdog(void *arg)
          {
              time_t start = time(0);
              (void)arg;
              while (!conc_stop) {
                  struct timespec ts = { 1, 0 };
                  nanosleep(&ts, 0);
                  long secs = (long)(time(0) - start);
                  printf("RACE alive %lds: %lu punches, %lu touches, %lu writes (%lu errors)",
                         secs, conc_punched(), conc_touches, conc_writes, conc_werr);
                  for (int i = 0; i < conc_punchers; i++) {
                      if (conc_inpunch[i])
                          printf(", t%d inside punch %lu for %lds", i, conc_inpunch[i] - 1,
                                 secs - conc_since[i]);
                      else
                          printf(", t%d between punches", i);
                  }
                  printf("\n");
                  fflush(stdout);
              }
              return 0;
          }

          static unsigned char marker_of(unsigned long pi)
          {
              return (unsigned char)(pi % 251) + 1;   /* never zero */
          }

          static unsigned long conc_rand(unsigned long *seed)
          {
              *seed = (*seed * 6364136223846793005UL) + 1442695040888963407UL;
              return *seed >> 17;
          }

          static void *conc_toucher(void *arg)
          {
              unsigned long seed = ((unsigned long)(long)arg + 1) * 7919;
              char *m = ((long)arg == 0) ? conc_b : conc_a;   /* both mappings stay in use */
              while (!conc_stop) {
                  unsigned long pi = conc_rand(&seed) % conc_pages;
                  unsigned char want = marker_of(pi);
                  m[pi * conc_ps] = want;
                  unsigned char got = m[pi * conc_ps];
                  if ((got != want) && (got != 0))
                      conc_bad++;
                  conc_touches++;
              }
              return 0;
          }

          /* Writing through the fd as well, because the touchers above cannot reach the half of
             the punch that maintains the file's own account of its pages: on aarch64 a page
             dirtied through a mapping is never seen as dirty (see write_through_fd), so tmpfs is
             never asked to record the range, the range map the punch has to split stays empty,
             and nothing is ever pinned. This thread writes each page's own marker, so the
             invariant checked at the end is the same one the touchers keep, and fsyncs to make
             tmpfs account for the range -- which is what the punch then has to undo. */
          static void *conc_writer(void *arg)
          {
              int fd = (int)(long)arg;
              unsigned long seed = 104729;
              while (!conc_stop) {
                  unsigned long pi = conc_rand(&seed) % conc_pages;
                  unsigned long n = 1 + (conc_rand(&seed) % 64);
                  if (pi + n > conc_pages)
                      n = conc_pages - pi;
                  for (unsigned long i = 0; i < n; i++) {
                      unsigned char v = marker_of(pi + i);
                      if (pwrite(fd, &v, 1, (off_t)((pi + i) * conc_ps)) != 1)
                          conc_werr++;
                  }
                  if (fsync(fd) != 0)
                      conc_werr++;
                  conc_writes += n;
                  struct stat st;
                  /* Sampled during the race: if the file never accounts for a block, the range
                     map is empty and the split path was never reached, whatever else passed. */
                  if ((fstat(fd, &st) == 0) && (st.st_blocks > conc_blocks_max))
                      conc_blocks_max = st.st_blocks;
              }
              return 0;
          }

          /* The punches drive the race: everyone else spins until they are done. Each one is
             announced before and accounted after, because a run that stops here says nothing
             about whether it was stuck or merely slow unless the log shows which punch it was on
             and how many the ones before it managed per second. The deadline is what keeps a
             stuck run from spending the whole step's timeout in silence: it gives up the
             remaining punches and lets the test report what it did reach.

             There is more than one of these, and they pick their ranges independently, so two
             punches overlap sooner or later: the same page is then reached by both, and whichever
             gets there second must find it already gone from the file's map of its pages and
             already dropped, rather than release a pin twice or free a page twice. The removal
             happens under the filesystem's mutex, so this is a check on that claim, not a hope. */
          static void *conc_puncher(void *arg)
          {
              long id = (long)arg;
              unsigned long seed = 4919 + (unsigned long)id * 7717;
              time_t start = time(0);
              unsigned long rounds = CONC_PUNCHES / (unsigned)conc_punchers;
              for (unsigned long i = 0; i < rounds; i++) {
                  unsigned long off = conc_rand(&seed) % (CONC_LEN - conc_ps);
                  unsigned long len = conc_ps + (conc_rand(&seed) % (CONC_LEN / 4));
                  if (off + len > CONC_LEN)
                      len = CONC_LEN - off;
                  long secs = (long)(time(0) - start);
                  if (secs > CONC_SECONDS) {
                      printf("RACE t%ld gave up at punch %lu after %lds\n", id, i, secs);
                      fflush(stdout);
                      break;
                  }
                  /* Every one of them, not every tenth: if the guest stops inside a punch rather
                     than between two, the last line printed is the only thing that says which
                     one, and its offset and length are what makes it reproducible. */
                  printf("RACE t%ld punch %lu at %lds [0x%lx,0x%lx): %lu done, %lu touches,"
                         " %lu writes, %ld blocks\n", id, i, secs, off, off + len,
                         conc_punched(), conc_touches, conc_writes, conc_blocks_max);
                  fflush(stdout);
                  /* deliberately unaligned: the edges have to be zeroed rather than freed */
                  conc_since[id] = secs;
                  conc_inpunch[id] = i + 1;
                  int rv = fallocate(conc_fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                     (long)off, (long)len);
                  conc_inpunch[id] = 0;
                  if (rv == 0)
                      conc_done[id]++;
              }
              /* The touchers and the writer stop when the LAST puncher is done, not the first. */
              if (__atomic_sub_fetch(&conc_punchers_left, 1, __ATOMIC_SEQ_CST) == 0)
                  conc_stop = 1;
              return 0;
          }

          static void concurrent_test(void)
          {
              conc_ps = (unsigned long)sysconf(_SC_PAGESIZE);
              conc_pages = CONC_LEN / conc_ps;
              long fd = syscall(SYS_memfd_create, "concurrent", 0);
              if ((fd < 0) || (ftruncate((int)fd, CONC_LEN) != 0)) {
                  ok("concurrent_setup", 0, "fd=%ld errno=%d (%s)", fd, errno, strerror(errno));
                  return;
              }
              conc_a = mmap(NULL, CONC_LEN, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              conc_b = mmap(NULL, CONC_LEN, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if ((conc_a == MAP_FAILED) || (conc_b == MAP_FAILED)) {
                  ok("concurrent_setup", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              conc_fd = (int)fd;
              conc_punchers_left = conc_punchers;
              pthread_t t[CONC_TOUCHERS + 2 + CONC_PUNCHERS];
              int started = 0, touchers = 0, failed;
              /* First, so that it is already beating if anything below gets stuck. */
              if (pthread_create(&t[started], 0, conc_watchdog, 0) == 0)
                  started++;
              for (long i = 0; i < CONC_TOUCHERS; i++)
                  if (pthread_create(&t[started], 0, conc_toucher, (void *)i) == 0) {
                      started++;
                      touchers++;
                  }
              failed = (touchers == 0);
              if (!failed && conc_writers) {
                  if (pthread_create(&t[started], 0, conc_writer, (void *)fd) == 0)
                      started++;
                  else
                      failed = 1;
              }
              for (long i = 0; !failed && (i < conc_punchers); i++) {
                  if (pthread_create(&t[started], 0, conc_puncher, (void *)i) == 0)
                      started++;
                  else
                      failed = 1;
              }
              if (failed) {
                  conc_stop = 1;
                  ok("concurrent_setup", 0, "pthread_create errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              for (int i = 0; i < started; i++)
                  pthread_join(t[i], 0);
              /* The blocks are what says the race reached the range map at all, and the write
                 errors are here because a write that silently failed would empty it just as
                 effectively as never writing. */
              ok("concurrent_setup",
                 (!conc_writers || (conc_blocks_max > 0)) && (conc_werr == 0) &&
                 (conc_punched() == CONC_PUNCHES),
                 "%d threads (%d of them punching), %lu of %d punches, %lu touches, %lu page"
                 " writes through the fd (%lu errors), file held up to %ld blocks during the race",
                 started, conc_punchers, conc_punched(), CONC_PUNCHES, conc_touches, conc_writes,
                 conc_werr, conc_blocks_max);

              /* Nothing is racing any more: every page must read the same through both mappings,
                 and be either its own marker or a hole. */
              unsigned long mismatched = 0, foreign = 0;
              for (unsigned long pi = 0; pi < conc_pages; pi++) {
                  unsigned char a = conc_a[pi * conc_ps], b = conc_b[pi * conc_ps];
                  if (a != b)
                      mismatched++;
                  if ((a != 0) && (a != marker_of(pi)))
                      foreign++;
              }
              ok("concurrent_no_corruption", (conc_bad == 0) && (foreign == 0) && (mismatched == 0),
                 "%lu pages holding another page's marker, %lu incoherent between the two mappings,"
                 " %lu bad reads during the race", foreign, mismatched, conc_bad);
              munmap(conc_a, CONC_LEN);
              munmap(conc_b, CONC_LEN);
              close((int)fd);
          }

          /* Committing and uncommitting the same file over and over, which is what a JVM heap that
             grows and shrinks does for hours. The page struct is deliberately left behind by the
             punch, so the first cycle keeps a little memory for good; what must not happen is that
             each further cycle keeps a little more. Like the other MemFree checks this one only
             means anything inside nanos, where the number is the physical heap of the only process
             running; on a Linux host it is noise and the check fails there. */
          #define CYC_LEN    (32 * MB)
          #define CYC_ROUNDS 6

          static void cycles_test(void)
          {
              long fd = syscall(SYS_memfd_create, "cycles", 0);
              if ((fd < 0) || (ftruncate((int)fd, CYC_LEN) != 0)) {
                  ok("cycles_setup", 0, "fd=%ld errno=%d (%s)", fd, errno, strerror(errno));
                  return;
              }
              long pristine = meminfo_free_kb(), settled = 0, worst = 0;
              for (int i = 0; i < CYC_ROUNDS; i++) {
                  char *m = mmap(NULL, CYC_LEN, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
                  if (m == MAP_FAILED) {
                      ok("cycles_reclaim", 0, "mmap failed at cycle %d errno=%d (%s)",
                         i, errno, strerror(errno));
                      close((int)fd);
                      return;
                  }
                  memset(m, 0xc3, CYC_LEN);
                  int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                     0, CYC_LEN);
                  munmap(m, CYC_LEN);
                  long now = meminfo_free_kb();
                  if (i == 0)
                      settled = now;          /* what the first cycle keeps is the one-time cost */
                  else if (settled - now > worst)
                      worst = settled - now;
                  printf("CYCLE %d punch=%d MemFree=%ldkB (pristine %ldkB, after cycle 0 %ldkB)\n",
                         i, pr, now, pristine, settled);
                  fflush(stdout);
              }
              /* One page struct per page of the file is retained by design; a leak would show up
                 as a further loss on every cycle, which this bounds at a quarter of one. */
              ok("cycles_reclaim", worst <= (long)(CYC_LEN / 1024 / 8),
                 "worst further loss after the first cycle: %ldkB over %d cycles of %luM"
                 " (one-time cost %ldkB)",
                 worst, CYC_ROUNDS, (unsigned long)(CYC_LEN / MB), pristine - settled);
              close((int)fd);
          }

          /* A hole that overhangs the written part of a file at one end only. The map of the pages
             a tmpfs file holds is split by the punch, and a hole strictly inside one of its ranges
             (which is what an unaligned punch of a fully written file produces) splits it in two,
             while a hole that runs off one end only trims it. Those two cases are separate paths;
             the checks above reach the first one alone. */
          static void punch_overhang(const char *name, int write_low)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = 16 * ps;
              unsigned long wstart = write_low ? 0 : 8 * ps;      /* written half */
              unsigned long hstart = write_low ? 4 * ps : 0;      /* hole, overhanging it */
              unsigned long hlen = write_low ? (len - 4 * ps) : 12 * ps;
              long fd = syscall(SYS_memfd_create, name, 0);
              if (fd < 0) {
                  skip(name, "no memfd_create: errno=%d (%s)", errno, strerror(errno));
                  return;
              }
              if (ftruncate((int)fd, len) != 0) {
                  ok(name, 0, "ftruncate errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              char buf[16];
              memset(buf, 0xd7, sizeof(buf));
              int wb = 0;
              for (unsigned long off = wstart; off < wstart + 8 * ps; off += ps)
                  if (pwrite((int)fd, buf, sizeof(buf), (off_t)off) != (ssize_t)sizeof(buf))
                      wb = errno;
              if ((wb == 0) && (fsync((int)fd) != 0))
                  wb = errno;
              struct stat before, after;
              fstat((int)fd, &before);
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                 (long)hstart, (long)hlen);
              fstat((int)fd, &after);

              /* The written pages outside the hole keep their bytes, those inside read as a hole,
                 and only the pages that were actually held can be given back. */
              char v;
              int outside_intact = 1, inside_zero = 1;
              for (unsigned long off = wstart; off < wstart + 8 * ps; off += ps) {
                  if (pread((int)fd, &v, 1, (off_t)off) != 1)
                      continue;
                  if ((off >= hstart) && (off < hstart + hlen))
                      inside_zero &= (v == 0);
                  else
                      outside_intact &= (v == (char)0xd7);
              }
              ok(name, (wb == 0) && (pr == 0) && outside_intact && inside_zero &&
                 (before.st_blocks > 0) && (after.st_blocks < before.st_blocks),
                 "wrote pages %lu-%lu, punched [%lu,%lu): outside_intact=%d inside_zero=%d"
                 " st_blocks %ld -> %ld (write+fsync %s, punch rv=%d)",
                 wstart / ps, wstart / ps + 7, hstart / ps, (hstart + hlen) / ps,
                 outside_intact, inside_zero, (long)before.st_blocks, (long)after.st_blocks,
                 wb ? strerror(wb) : "ok", pr);
              close((int)fd);
          }

          /* A hole smaller than a page, which is the one shape of punch that can give nothing
             back: the range contains no whole page, so there is nothing to unmap, nothing to
             unpin and nothing to free -- only the bytes inside it have to become zeroes, while
             the page keeps its place in the file and the file keeps its account of it. It is a
             branch of its own in the punch, and the only one none of the checks above reach:
             they all punch at least one whole page. */
          static void punch_subpage_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = 4 * ps;
              long fd = syscall(SYS_memfd_create, "subpage", 0);
              if (fd < 0) {
                  skip("punch_subpage", "no memfd_create: errno=%d (%s)", errno, strerror(errno));
                  skip("punch_subpage_blocks", "no memfd_create");
                  return;
              }
              char *m = MAP_FAILED;
              if (ftruncate((int)fd, len) == 0)
                  m = mmap(NULL, len, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("punch_subpage", 0, "setup failed errno=%d (%s)", errno, strerror(errno));
                  skip("punch_subpage_blocks", "the file could not be set up");
                  close((int)fd);
                  return;
              }
              memset(m, 0x9c, len);
              int wb = write_through_fd((int)fd, len, 0x9c);
              struct stat before, after;
              fstat((int)fd, &before);

              /* Both ends inside page 1, so the hole crosses no page boundary at all. */
              unsigned long hs = ps + 100, he = ps + 300;
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE,
                                 (long)hs, (long)(he - hs));
              fstat((int)fd, &after);
              int inside_zero = ((unsigned char)m[hs] == 0) && ((unsigned char)m[he - 1] == 0);
              int outside_intact = ((unsigned char)m[hs - 1] == 0x9c) &&
                                   ((unsigned char)m[he] == 0x9c) &&
                                   ((unsigned char)m[0] == 0x9c) &&
                                   ((unsigned char)m[len - 1] == 0x9c);
              ok("punch_subpage", (pr == 0) && inside_zero && outside_intact,
                 "rv=%d errno=%d hole=[%lu,%lu), both ends inside page 1: inside_zero=%d"
                 " outside_intact=%d (m[hs-1]=0x%02x m[hs]=0x%02x m[he-1]=0x%02x m[he]=0x%02x)",
                 pr, pr ? errno : 0, hs, he, inside_zero, outside_intact,
                 (unsigned char)m[hs - 1], (unsigned char)m[hs],
                 (unsigned char)m[he - 1], (unsigned char)m[he]);
              /* And the file must still hold every page it held: one given back here would have
                 thrown away the bytes around the hole. */
              if (wb != 0)
                  skip("punch_subpage_blocks", "the file could not be written through the fd: %s",
                       strerror(wb));
              else
                  ok("punch_subpage_blocks",
                     (before.st_blocks > 0) && (after.st_blocks == before.st_blocks),
                     "st_blocks %ld -> %ld for a %lu-byte hole inside a single page",
                     (long)before.st_blocks, (long)after.st_blocks, he - hs);
              munmap(m, len);
              close((int)fd);
          }

          /* More ranges in one hole than the punch takes out of the file's map in one pass. The
             pins taken when a range was written back cannot be released while the filesystem's
             mutex is held -- that is the lock cycle this change had to stay out of -- so the
             ranges are collected under it in batches and their pins released after dropping it,
             and the pass repeats for as long as it comes back full. Nothing reaches that second
             pass unless one hole spans more than sixteen separate ranges, and that needs a file
             written with gaps: the map only merges ranges that touch, so writing every other page
             leaves each written page a range of its own. (The many-mappings check saturates a
             batch of the same size elsewhere: the mappings of the node, not the ranges of the
             file.) */
          #define RANGES_PAGES 80         /* 40 written, 40 left as gaps -> 40 ranges */

          static void punch_many_ranges_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = RANGES_PAGES * ps;
              long fd = syscall(SYS_memfd_create, "manyranges", 0);
              if ((fd < 0) || (ftruncate((int)fd, len) != 0)) {
                  skip("punch_many_ranges", "no memfd_create: errno=%d (%s)",
                       errno, strerror(errno));
                  return;
              }
              unsigned char v = 0xb4;
              int wb = 0;
              unsigned long written = 0;
              for (unsigned long pi = 0; pi < RANGES_PAGES; pi += 2) {
                  if (pwrite((int)fd, &v, 1, (off_t)(pi * ps)) != 1)
                      wb = errno;
                  else
                      written++;
              }
              if ((wb == 0) && (fsync((int)fd) != 0))
                  wb = errno;
              struct stat before, after;
              fstat((int)fd, &before);
              long f0 = meminfo_free_kb();
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, (long)len);
              long f1 = meminfo_free_kb();
              fstat((int)fd, &after);

              unsigned long left = 0;
              for (unsigned long pi = 0; pi < RANGES_PAGES; pi++) {
                  char got;
                  if ((pread((int)fd, &got, 1, (off_t)(pi * ps)) == 1) && (got != 0))
                      left++;
              }
              /* st_blocks counts the pages the map holds, so before the punch it has to be the
                 written pages and no more: were the map holding one range over the whole file
                 instead of one per written page, it would report every page, and the hole would
                 never have spanned more than a single batch whatever else passed. */
              long accounted = (long)(before.st_blocks * 512 / (long)ps);
              if (wb != 0)
                  skip("punch_many_ranges", "the file could not be written through the fd: %s",
                       strerror(wb));
              else
                  ok("punch_many_ranges",
                     (pr == 0) && (left == 0) && (after.st_blocks == 0) &&
                     (accounted == (long)written) && (written > 16),
                     "%lu pages written one range apart (the file accounted for %ld pages, and the"
                     " punch takes 16 ranges per pass), punched as one hole: %lu pages still"
                     " readable, st_blocks %ld -> %ld, MemFree %ldkB -> %ldkB",
                     written, accounted, left, (long)before.st_blocks, (long)after.st_blocks,
                     f0, f1);
              close((int)fd);
          }

          /* A private mapping of the file, which is the other way a page can still be referenced
             when the hole reaches it. The concurrent check covers a reference that comes and goes
             -- a fault racing with the punch -- while this one holds it for the whole punch, which
             is the case that must not be freed from under it: such a page is zeroed in place
             instead, so that the file still reads as a hole through every other view of it.
             What the private mapping itself sees afterwards is a separate question, about how
             nanos implements private file mappings rather than about this change, and it is
             reported rather than gated. On Linux a page it only read is dropped and re-reads as
             zero, while a page it wrote is a private copy of its own and keeps its contents. */
          #define PRIV_PAGES 16

          static void punch_private_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              unsigned long len = PRIV_PAGES * ps;
              unsigned long half = PRIV_PAGES / 2;
              long fd = syscall(SYS_memfd_create, "private", 0);
              if (fd < 0) {
                  skip("punch_private_shared_zero", "no memfd_create: errno=%d (%s)",
                       errno, strerror(errno));
                  skip("punch_private_view", "no memfd_create");
                  return;
              }
              char *shared = MAP_FAILED, *priv = MAP_FAILED;
              if (ftruncate((int)fd, len) == 0) {
                  shared = mmap(NULL, len, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
                  priv = mmap(NULL, len, PROT_READ | PROT_WRITE, MAP_PRIVATE, (int)fd, 0);
              }
              if ((shared == MAP_FAILED) || (priv == MAP_FAILED)) {
                  skip("punch_private_shared_zero", "MAP_SHARED=%p MAP_PRIVATE=%p errno=%d (%s)",
                       shared, priv, errno, strerror(errno));
                  skip("punch_private_view", "the file could not be mapped both ways");
                  if (shared != MAP_FAILED) munmap(shared, len);
                  if (priv != MAP_FAILED) munmap(priv, len);
                  close((int)fd);
                  return;
              }
              memset(shared, 0xc7, len);
              int wb = write_through_fd((int)fd, len, 0xc7);

              /* The first half is only read through the private mapping, so those pages are the
                 file's own and are what the punch finds referenced; the second half is written,
                 which on a private mapping makes a copy that the file no longer owns. */
              unsigned long seen = 0;
              for (unsigned long pi = 0; pi < half; pi++)
                  seen += (unsigned char)priv[pi * ps];
              for (unsigned long pi = half; pi < PRIV_PAGES; pi++)
                  priv[pi * ps] = 0x5e;

              /* Whether those writes stayed private at all, asked before anything is punched: a
                 mapping that does not copy on write puts them in the file's own pages, where the
                 shared view sees them -- and then what the private view reads after the hole says
                 nothing about the punch, because there was never a private copy to keep. */
              unsigned long leaked = 0;
              for (unsigned long pi = half; pi < PRIV_PAGES; pi++)
                  if ((unsigned char)shared[pi * ps] == 0x5e)
                      leaked++;

              struct stat before, after;
              fstat((int)fd, &before);
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, (long)len);
              fstat((int)fd, &after);

              int shared_zero = 1, fd_zero = 1;
              for (unsigned long pi = 0; pi < PRIV_PAGES; pi++) {
                  char got;
                  if ((unsigned char)shared[pi * ps] != 0)
                      shared_zero = 0;
                  if ((pread((int)fd, &got, 1, (off_t)(pi * ps)) == 1) && (got != 0))
                      fd_zero = 0;
              }
              ok("punch_private_shared_zero",
                 (pr == 0) && shared_zero && fd_zero &&
                 ((wb != 0) || (after.st_blocks == 0)),
                 "rv=%d with a live private mapping of the same file: shared view reads a hole=%d,"
                 " the fd reads a hole=%d, st_blocks %ld -> %ld (%lu pages read through the"
                 " private mapping first, sum 0x%lx)",
                 pr, shared_zero, fd_zero, (long)before.st_blocks, (long)after.st_blocks,
                 half, seen);

              unsigned long read_zero = 0, wrote_kept = 0, other = 0;
              for (unsigned long pi = 0; pi < PRIV_PAGES; pi++) {
                  unsigned char got = priv[pi * ps];
                  if (pi < half)
                      (got == 0) ? read_zero++ : other++;
                  else
                      (got == 0x5e) ? wrote_kept++ : other++;
              }
              ok("punch_private_view",
                 (read_zero == half) && (wrote_kept == half) && (other == 0) && (leaked == 0),
                 "of the pages a private mapping held across the punch, %lu of %lu it had only"
                 " read came back as a hole and %lu of %lu it had written kept their copy"
                 " (%lu did neither) -- which is what Linux reports; %lu of the %lu private"
                 " writes were visible through the shared mapping before the punch, so the"
                 " mapping %s copy on write",
                 read_zero, half, wrote_kept, half, other, leaked, half,
                 leaked ? "does not" : "does");
              munmap(shared, len);
              munmap(priv, len);
              close((int)fd);
          }

          /* More mappings of one file than the punch can unmap in one go. The lock over a node's
             mappings cannot be held while unmapping, so they are collected in batches and the walk
             resumes from a cursor -- a loop nothing exercises with the two or three mappings the
             checks above open, and one ZGC saturates by design: it keeps roughly three mappings
             per granule of the heap. A mapping the walk skipped keeps a page table entry for a
             page that has just been freed, so reading through it returns the bytes that were
             there rather than the hole, which is what every mapping is asked for here. */
          #define MANY_MAPS 40
          #define MANY_LEN  (4 * MB)

          static void many_maps_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              long fd = syscall(SYS_memfd_create, "manymaps", 0);
              if ((fd < 0) || (ftruncate((int)fd, MANY_LEN) != 0)) {
                  ok("many_maps_setup", 0, "fd=%ld errno=%d (%s)", fd, errno, strerror(errno));
                  return;
              }
              char *m[MANY_MAPS];
              int n = 0;
              for (int i = 0; i < MANY_MAPS; i++) {
                  m[n] = mmap(NULL, MANY_LEN, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
                  if (m[n] == MAP_FAILED)
                      break;
                  n++;
              }
              int wb = write_through_fd((int)fd, MANY_LEN, 0x7e);
              /* Faulted in through every mapping, so each one holds entries of its own. */
              unsigned long live = 0;
              for (int i = 0; i < n; i++)
                  for (unsigned long off = 0; off < MANY_LEN; off += ps)
                      live += (unsigned char)m[i][off];
              ok("many_maps_setup", (n > 16) && (wb == 0) && (live > 0),
                 "%d mappings of a %luM file (write+fsync %s)",
                 n, (unsigned long)(MANY_LEN / MB), wb ? strerror(wb) : "ok");
              if (n == 0) {
                  close((int)fd);
                  return;
              }

              struct stat before, after;
              fstat((int)fd, &before);
              long f0 = meminfo_free_kb();
              int pr = fallocate((int)fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, MANY_LEN);
              long f1 = meminfo_free_kb();
              fstat((int)fd, &after);

              int stale = -1;
              unsigned long stale_pages = 0;
              for (int i = 0; i < n; i++)
                  for (unsigned long off = 0; off < MANY_LEN; off += ps)
                      if (m[i][off] != 0) {
                          stale_pages++;
                          if (stale < 0)
                              stale = i;
                      }
              ok("many_maps_punch", (pr == 0) && (stale_pages == 0),
                 "rv=%d %lu pages still readable after the punch (first through mapping #%d),"
                 " st_blocks %ld -> %ld, MemFree %ldkB -> %ldkB",
                 pr, stale_pages, stale,
                 (long)before.st_blocks, (long)after.st_blocks, f0, f1);

              /* And they must all still be the same file: written through the last mapping, read
                 back through the first, across the batch boundary in both directions. */
              m[n - 1][0] = 0x21;
              m[n - 1][MANY_LEN - ps] = 0x22;
              ok("many_maps_refault",
                 (m[0][0] == 0x21) && (m[0][MANY_LEN - ps] == 0x22),
                 "wrote through mapping #%d, read 0x%02x/0x%02x through #0",
                 n - 1, (unsigned char)m[0][0], (unsigned char)m[0][MANY_LEN - ps]);
              for (int i = 0; i < n; i++)
                  munmap(m[i], MANY_LEN);
              close((int)fd);
          }

          /* An open question rather than a claim, and it is about the data in the file, not about
             the memory behind it. A tmpfs page dirtied only through a mapping is never seen as
             dirty on aarch64, so it is never written back and never pinned -- which leaves it
             looking exactly like a clean page to the eviction that runs when memory gets tight.
             Evicting it would be silent data loss, because a tmpfs read does not go to storage:
             it zero-fills. That is the shape of a ZGC heap, whose pages are only ever written
             through the mapping. Nothing is punched here, so the pages are in the state the
             question is about, and every page carries its own marker so a page that comes back
             as a hole can be told from one that comes back as another page. Reported, not gated:
             if it reproduces it is a bug of its own, older and worse than the punch. */
          #define EVICT_FILL  (200 * MB)
          #define EVICT_CHUNK (8 * MB)
          #define EVICT_FLOOR (64 * MB)

          static void evict_test(void)
          {
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              long f0, c0, f1, c1, f2, c2;
              meminfo2(&f0, &c0);
              long fd = syscall(SYS_memfd_create, "evict", 0);
              if ((fd < 0) || (ftruncate((int)fd, EVICT_FILL) != 0)) {
                  ok("evict_setup", 0, "fd=%ld errno=%d (%s)", fd, errno, strerror(errno));
                  return;
              }
              char *m = mmap(NULL, EVICT_FILL, PROT_READ | PROT_WRITE, MAP_SHARED, (int)fd, 0);
              if (m == MAP_FAILED) {
                  ok("evict_setup", 0, "mmap errno=%d (%s)", errno, strerror(errno));
                  close((int)fd);
                  return;
              }
              unsigned long pages = EVICT_FILL / ps;
              for (unsigned long pi = 0; pi < pages; pi++)
                  m[pi * ps] = marker_of(pi);       /* through the mapping only: no write, no fsync */
              struct stat st;
              fstat((int)fd, &st);
              meminfo2(&f1, &c1);
              printf("EVICT filled %luM            MemFree=%ldkB Cached=%ldkB st_blocks=%ld\n",
                     (unsigned long)(EVICT_FILL / MB), f1, c1, (long)st.st_blocks);
              fflush(stdout);
              ok("evict_setup", 1, "%lu pages written through the mapping alone, file accounts"
                 " for %ld blocks", pages, (long)st.st_blocks);

              /* Squeeze, without touching the file again. */
              #define EVICT_CHUNKS 128
              char *chunk[EVICT_CHUNKS];
              int chunks = 0;
              unsigned long got = 0;
              long f = f1, c;
              while ((f > (long)(EVICT_FLOOR / 1024)) && (chunks < EVICT_CHUNKS)) {
                  char *a = mmap(NULL, EVICT_CHUNK, PROT_READ | PROT_WRITE,
                                 MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
                  if (a == MAP_FAILED)
                      break;
                  memset(a, 0xa5, EVICT_CHUNK);
                  chunk[chunks++] = a;
                  got += EVICT_CHUNK;
                  meminfo2(&f, &c);
              }
              meminfo2(&f2, &c2);
              printf("EVICT pressure %luM          MemFree=%ldkB Cached=%ldkB\n", got / MB, f2, c2);
              fflush(stdout);

              /* Give the pressure back before reading the file: a page that was evicted has to
                 be faulted in again to be read, and doing that with the memory still held would
                 make the guest die of exhaustion in the middle of the answer. The eviction, if
                 there was one, has already happened. */
              for (int i = 0; i < chunks; i++)
                  munmap(chunk[i], EVICT_CHUNK);

              unsigned long zeroed = 0, foreign = 0;
              for (unsigned long pi = 0; pi < pages; pi++) {
                  unsigned char v = m[pi * ps];
                  if (v == 0)
                      zeroed++;
                  else if (v != marker_of(pi))
                      foreign++;
              }
              ok("evict_keeps_data", (zeroed == 0) && (foreign == 0),
                 "%lu of %lu pages came back as zeroes and %lu held another page's marker after"
                 " %luM of pressure (Cached %ldkB -> %ldkB)",
                 zeroed, pages, foreign, got / MB, c1, c2);
              munmap(m, EVICT_FILL);
              close((int)fd);
          }

          int main(int argc, char **argv)
          {
              printf("PROBE cpus_online            %s %ld processor(s) reported by sysconf\n",
                     (sysconf(_SC_NPROCESSORS_ONLN) > 1) ? "PASS" : "FAIL",
                     sysconf(_SC_NPROCESSORS_ONLN));
              fflush(stdout);
              if ((argc > 1) && !strcmp(argv[1], "concurrent")) {
                  /* "concurrent [punchers] [writers]": with one puncher no two punches can
                     overlap, and with no writer nothing puts a range back in the file's map
                     while a punch is taking it out. A fault that survives either of those has
                     been told where it does not come from. */
                  if (argc > 2)
                      conc_punchers = atoi(argv[2]);
                  if (argc > 3)
                      conc_writers = atoi(argv[3]);
                  if ((conc_punchers < 1) || (conc_punchers > CONC_PUNCHERS))
                      conc_punchers = CONC_PUNCHERS;
                  printf("PROBE conc_config           PASS %d puncher(s), %d writer(s)\n",
                         conc_punchers, conc_writers);
                  fflush(stdout);
                  concurrent_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              if ((argc > 1) && !strcmp(argv[1], "cycles")) {
                  cycles_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              if ((argc > 1) && !strcmp(argv[1], "maps")) {
                  many_maps_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              if ((argc > 1) && !strcmp(argv[1], "evict")) {
                  evict_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              if ((argc > 1) && !strcmp(argv[1], "pressure")) {
                  pressure_test();
                  printf("PROBE DONE\n");
                  fflush(stdout);
                  return 0;
              }
              /* 1. memfd_create: ZGC's primary heap backing file. Raw syscall so
                    a missing kernel entry shows up as ENOSYS, unambiguously. */
              long mfd = syscall(SYS_memfd_create, "zgc-probe", (unsigned)MFD_CLOEXEC);
              ok("memfd_create", mfd >= 0, "rv=%ld errno=%d (%s)",
                 mfd, mfd < 0 ? errno : 0, mfd < 0 ? strerror(errno) : "-");

              /* 2. statfs f_type: how ZGC decides a directory is tmpfs/hugetlbfs
                    when memfd_create is unavailable. */
              struct statfs sb;
              if (statfs("/", &sb) == 0) {
                  const char *kind = (sb.f_type == TMPFS_MAGIC) ? " = tmpfs, usable by ZGC"
                      : (sb.f_type == HUGETLBFS_MAGIC) ? " = hugetlbfs, usable by ZGC"
                      : (sb.f_type == 0) ? " = unset, no filesystem type reported at all"
                      : " = some other filesystem (fine, just not a ZGC fallback)";
                  /* The nanos gap is f_type never being filled in; a non-tmpfs
                     value is correct behaviour, so only zero counts as a fail. */
                  ok("statfs_f_type", sb.f_type != 0, "f_type=0x%lx%s bsize=%ld (ZGC wants tmpfs=0x%x or hugetlbfs=0x%x)",
                     (unsigned long)sb.f_type, kind, (long)sb.f_bsize, TMPFS_MAGIC, HUGETLBFS_MAGIC);
              } else
                  ok("statfs_f_type", 0, "statfs failed errno=%d (%s)", errno, strerror(errno));

              /* 3. Huge PROT_NONE reservation: ZGC reserves a multi-TB address
                    range up front and commits into it later. */
              static const unsigned long sizes[] = { 16UL * GB, 256UL * GB, 4096UL * GB, 16384UL * GB };
              static const char *names[] = { "reserve_16G", "reserve_256G", "reserve_4T", "reserve_16T" };
              void *biggest = MAP_FAILED;
              unsigned long biggest_len = 0;
              for (unsigned i = 0; i < sizeof(sizes) / sizeof(sizes[0]); i++) {
                  void *r = mmap(NULL, sizes[i], PROT_NONE,
                                 MAP_PRIVATE | MAP_ANONYMOUS | MAP_NORESERVE, -1, 0);
                  ok(names[i], r != MAP_FAILED, "addr=%p errno=%d (%s)",
                     r, r == MAP_FAILED ? errno : 0, r == MAP_FAILED ? strerror(errno) : "-");
                  if (r != MAP_FAILED) {
                      if (biggest == MAP_FAILED) { biggest = r; biggest_len = sizes[i]; }
                      else { munmap(r, sizes[i]); }
                  }
              }

              /* 4. A writable file to stand in for the memfd (the tmpfs fallback
                    ZGC would use). */
              const char *path = "/zgcprobe.dat";
              unsigned long flen = 8 * MB;
              unsigned long ps = (unsigned long)sysconf(_SC_PAGESIZE);
              int fd = (mfd >= 0) ? (int)mfd : open(path, O_RDWR | O_CREAT | O_TRUNC, 0600);
              ok("backing_file_open", fd >= 0, "%s fd=%d errno=%d (%s)",
                 (mfd >= 0) ? "via memfd" : path, fd, fd < 0 ? errno : 0,
                 fd < 0 ? strerror(errno) : "-");
              if (fd < 0) {
                  printf("PROBE DONE (no backing file — remaining checks skipped)\n");
                  return 0;
              }
              /* Without memfd_create this is a file on the image's root filesystem, which is only
                 as large as the image needed it to be: 8M does not fit, and the write that gives
                 the punch something to free would stop at ENOSPC and take the measurement with
                 it. Ask the filesystem what it has and take half, so that the column measures the
                 absence of a dealloc method rather than the size of the disk. */
              if (mfd < 0) {
                  struct statfs rb;
                  if ((statfs("/", &rb) == 0) && (rb.f_bavail > 0) && (rb.f_bsize > 0)) {
                      unsigned long avail = (unsigned long)rb.f_bavail * (unsigned long)rb.f_bsize;
                      if (avail / 2 < flen) {
                          flen = (avail / 2) & ~(ps - 1);
                          if (flen < 64 * 1024)
                              flen = 64 * 1024;    /* too little to be worth adjusting for */
                      }
                  }
              }
              int tr = ftruncate(fd, flen);
              ok("ftruncate_backing", tr == 0, "%luKB backing file: rv=%d errno=%d (%s)",
                 flen / 1024, tr, tr ? errno : 0, tr ? strerror(errno) : "-");

              /* 5. THE decisive one: two MAP_SHARED mappings of the same file
                    offset must observe each other's writes. Without this a memfd
                    is only a name, and ZGC's heap views would silently diverge. */
              char *a = mmap(NULL, flen, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
              char *b = mmap(NULL, flen, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
              if (a != MAP_FAILED && b != MAP_FAILED) {
                  memset(a, 0xa5, 4096);
                  a[flen - 1] = 0x5a;
                  int coherent = ((unsigned char)b[0] == 0xa5) &&
                                 ((unsigned char)b[4095] == 0xa5) &&
                                 ((unsigned char)b[flen - 1] == 0x5a);
                  ok("mmap_shared_coherent", coherent, "a=%p b=%p b[0]=0x%02x b[end]=0x%02x",
                     a, b, (unsigned char)b[0], (unsigned char)b[flen - 1]);
              } else {
                  ok("mmap_shared_coherent", 0, "a=%p b=%p errno=%d (%s)", a, b, errno, strerror(errno));
              }

              /* 6. Commit into the reservation: MAP_FIXED of the file over a
                    PROT_NONE range is exactly how ZGC maps a granule. */
              if (biggest != MAP_FAILED && biggest_len >= 2 * MB) {
                  void *c = mmap(biggest, 2 * MB, PROT_READ | PROT_WRITE,
                                 MAP_SHARED | MAP_FIXED, fd, 0);
                  int good = (c == biggest);
                  if (good) {
                      ((char *)c)[0] = 0x11;
                      good = (a != MAP_FAILED) ? ((unsigned char)a[0] == 0x11) : 1;
                  }
                  ok("mapfixed_into_reserve", good, "want=%p got=%p a[0]=0x%02x",
                     biggest, c, (a != MAP_FAILED) ? (unsigned char)a[0] : 0);
              } else {
                  ok("mapfixed_into_reserve", 0, "no reservation to commit into");
              }

              /* 7. Punch-hole uncommit: how ZGC returns memory. The mappings are
                    deliberately left in place while the hole is punched, because
                    that is ZGC's own shape -- it keeps roughly three mappings per
                    granule alive -- so a hole that only gives its pages back once
                    the last mapping is gone would be of no use to it. */
              long free_before = meminfo_free_kb();
              if (a != MAP_FAILED)
                  memset(a, 0x77, flen);            /* fault the whole file in */
              /* ...and have the file itself account for those pages, so that the
                 punch has blocks to free and a pin to release (write_through_fd). */
              int wb = write_through_fd(fd, flen, 0x77);
              long free_touched = meminfo_free_kb();
              struct stat stb;
              long blocks_touched = (fstat(fd, &stb) == 0) ? (long)stb.st_blocks : -1;
              int pr = fallocate(fd, FALLOC_FL_PUNCH_HOLE | FALLOC_FL_KEEP_SIZE, 0, flen);
              long free_after = meminfo_free_kb();
              ok("punch_hole", pr == 0, "rv=%d errno=%d (%s) MemFree kB: start=%ld touched=%ld punched=%ld (reclaimed=%ld)",
                 pr, pr ? errno : 0, pr ? strerror(errno) : "-",
                 free_before, free_touched, free_after, free_after - free_touched);

              /* 7a. The claim under test, measured two ways. st_blocks is the
                     filesystem's own account of the pages it holds, exact and
                     free of noise; MemFree says the physical heap really got them
                     back, and at the punch rather than at the close. (On a Linux
                     host MemFree moves for other reasons and this second one is
                     not meaningful -- inside nanos there is one process and the
                     number is exact.) */
              long blocks_punched = (fstat(fd, &stb) == 0) ? (long)stb.st_blocks : -1;
              if (wb != 0)
                  /* The stock image reaches here on a file of its small root filesystem, where
                     the write runs out of space: the file never accounted for the pages, so this
                     has nothing to measure. Its contrast with the klib column is punch_hole_
                     reclaims, which does not need the write. */
                  skip("punch_hole_frees_blocks", "the file could not be written through the fd:"
                       " %s", strerror(wb));
              else
                  ok("punch_hole_frees_blocks",
                     (pr == 0) && (blocks_touched > 0) && (blocks_punched == 0),
                     "st_blocks %ld -> %ld across the punch of the whole %luKB file",
                     blocks_touched, blocks_punched, (unsigned long)(flen / 1024));
              long reclaimed = free_after - free_touched;
              ok("punch_hole_reclaims", (pr == 0) && (reclaimed >= (long)(flen / 1024 / 2)),
                 "reclaimed=%ldkB of the %luKB punched, with the file still mapped",
                 reclaimed, (unsigned long)(flen / 1024));

              /* 7b. The file must still behave like a file: the hole reads back as
                     zeroes, and writing into it again has to fault in fresh pages
                     that both mappings agree on -- the pages that were just freed
                     were freed from under a live mapping. */
              if (pr == 0 && a != MAP_FAILED) {
                  ok("punch_hole_reads_zero", (unsigned char)a[0] == 0x00,
                     "a[0]=0x%02x (Linux re-faults holes as zero)", (unsigned char)a[0]);
                  a[0] = 0x33;
                  a[flen - 1] = 0x44;
                  int refaulted = (b == MAP_FAILED) ||
                      (((unsigned char)b[0] == 0x33) && ((unsigned char)b[flen - 1] == 0x44));
                  ok("punch_hole_refault", refaulted, "b[0]=0x%02x b[end]=0x%02x",
                     (b == MAP_FAILED) ? 0 : (unsigned char)b[0],
                     (b == MAP_FAILED) ? 0 : (unsigned char)b[flen - 1]);
              }

              /* 7c. Where the memory comes back tells the failure apart: a punch
                     that is a no-op, pages pinned by the mappings, or MemFree not
                     accounting for the page cache at all. */
              if (a != MAP_FAILED) munmap(a, flen);
              if (b != MAP_FAILED) munmap(b, flen);
              if (biggest != MAP_FAILED) munmap(biggest, biggest_len);  /* also drops the MAP_FIXED view */
              long free_unmapped = meminfo_free_kb();
              close(fd);
              if (mfd < 0) unlink(path);
              long free_closed = meminfo_free_kb();
              ok("memory_returned", free_closed > free_touched,
                 "MemFree kB: touched=%ld afterPunch=%ld afterUnmap=%ld afterClose=%ld; st_blocks after the punch=%ld",
                 free_touched, free_after, free_unmapped, free_closed, blocks_punched);

              /* 7d. An unaligned hole, which ZGC never punches but the patch must
                     still get right: only whole pages can be given back, so the
                     partial pages at the edges are zeroed in place and nothing
                     outside the hole may be touched. */
              punch_partial_test();

              /* 7e. A hole overhanging the written part of the file at one end, which trims the
                     file's map of the pages it holds rather than splitting it in two the way 7d
                     does -- separate paths, and 7d reaches only the second. */
              punch_overhang("punch_overhang_tail", 1);
              punch_overhang("punch_overhang_head", 0);

              /* 7f. A hole with no whole page in it: nothing can be given back, only bytes
                     zeroed, and the file must keep every page it held. */
              punch_subpage_test();

              /* 7g. One hole spanning more ranges of the file's map than the punch takes out of
                     it per pass, so that the pass that repeats runs at all. */
              punch_many_ranges_test();

              /* 7h. A page a private mapping holds while the hole reaches it: it cannot be freed
                     and has to be zeroed, so that the file still reads as a hole. */
              punch_private_test();

              /* 8. Anonymous shared memory, the other shape of the same need. */
              void *s = mmap(NULL, 2 * MB, PROT_READ | PROT_WRITE,
                             MAP_SHARED | MAP_ANONYMOUS, -1, 0);
              ok("mmap_shared_anon", s != MAP_FAILED, "addr=%p errno=%d (%s)",
                 s, s == MAP_FAILED ? errno : 0, s == MAP_FAILED ? strerror(errno) : "-");

              printf("PROBE DONE\n");
              fflush(stdout);
              return 0;
          }
          EOF
          gcc -O2 -static -Wall -pthread -o zgcprobe zgcprobe.c
          file zgcprobe

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build kernel from this ref
        run: |
          make -j"$(nproc)" kernel PLATFORM=${{ matrix.platform }}
          cp "$(find output/platform/${{ matrix.platform }} -name kernel.img | head -1)" \
            /tmp/kernel-candidate.img

      # ops ships its nightly as a binary with no ELF beside it, and that is what the "before"
      # used to run: when the race faulted it, nanos symbolised the faulting instruction out of
      # the image and its own frame trace came out empty, so nothing could say who had called
      # it. A baseline built here has symbols the gdb stub can use -- and it is the same
      # compiler and the same flags as the kernel under test, so the only difference left
      # between the two runs is the change itself.
      # Built to stay where it was linked, for the same reason as the catcher's kernel below:
      # this run exists to be read, and an unnamed address is not a reading. It is a contrast
      # and never a gate, so a fixed layout costs it nothing -- what makes the race stop is a
      # lock order, not where the kernel happens to sit.
      - name: Build the kernel upstream is at, to run the "before" against
        run: |
          # A clone rather than a worktree of this one: gitversion.c is made from
          # $(ROOTDIR)/.git/index and .git/HEAD (kernel.mk:117), and a linked worktree has
          # neither -- its .git is a file, so make has a prerequisite it cannot build.
          git clone --depth 1 --branch master https://github.com/nanovms/nanos.git /tmp/base
          make -C /tmp/base -j"$(nproc)" kernel PLATFORM=${{ matrix.platform }} \
            CFLAGS-init.c=-DNO_KASLR
          cp "$(find /tmp/base/output/platform/${{ matrix.platform }} -name kernel.img | head -1)" \
            /tmp/kernel-baseline.img
          echo "BASE_ELF=$(find /tmp/base/output -name kernel.elf | head -1)" >> "$GITHUB_ENV"

      # nanos moves itself somewhere new on every boot (kaslr(), src/kernel/init.c), which is
      # why the stub answered with four addresses and no names: the ELF is linked at
      # KERNEL_BASE and the running kernel was somewhere else -- ffffffff88fbf310 on the boot
      # that faulted, ffffffffa6c8xxxx on the one that stopped. Built once more with that
      # turned off, the kernel stays where it was linked and the same symbols the compiler
      # emitted are the ones the stub reads. Only the catcher runs this one; everything that
      # is actually being validated keeps the default.
      #
      # The define goes on the one file that reads it, through the per-file hook in
      # rules.mk:150, and not through CFLAGS. A CFLAGS from the environment is marked exported
      # by make, so every sub-make receives it with whatever the parent appended to it in the
      # meantime: tools got -nostdinc and could not find unistd.h, and the boot loader got the
      # 64-bit kernel flags before adding its own -m32.
      - name: Build a kernel that stays where it was linked, for the catcher
        if: matrix.arch == 'x64'
        run: |
          # A copy of this checkout, for the same reason the baseline is a clone: a worktree
          # has no .git/index for gitversion.c to be made from. The objects already built here
          # are left out of it, because a build does not rebuild them for a changed flag and
          # this one is only worth having if the flag took.
          cp -a "$GITHUB_WORKSPACE" /tmp/diag
          rm -rf /tmp/diag/output
          make -C /tmp/diag -j"$(nproc)" kernel PLATFORM=${{ matrix.platform }} \
            CFLAGS-init.c=-DNO_KASLR
          echo "DIAG_ELF=$(find /tmp/diag/output -name kernel.elf | head -1)" >> "$GITHUB_ENV"
          cp "$(find /tmp/diag/output/platform/${{ matrix.platform }} -name kernel.img | head -1)" \
            /tmp/kernel-diag.img

      - name: Write the helpers both kernels are run through
        run: |
          # Installing a kernel in ops's nightly slot, with the klibs that belong to it: half of
          # this change lives in the tmpfs klib, so a kernel put there beside somebody else's
          # klibs is neither of the two things being compared.
          cat > swap-kernel.sh <<'EOF'
          #!/bin/bash
          set -e
          [ -n "$OPSK" ] || { echo "::error::OPSK is not set"; exit 1; }
          cp "$1" "$OPSK"
          KLIBDIR="$(dirname "$OPSK")/klibs"
          [ -d "$KLIBDIR" ] || { echo "::error::no klibs dir beside $OPSK"; exit 1; }
          for k in tmpfs shmem; do
            built="$(find "$2" -type f -path '*/bin/*' -name "$k" | head -1)"
            [ -n "$built" ] || { echo "::error::klib '$k' was not built under $2"; exit 1; }
            cp "$built" "$KLIBDIR/$k"
            echo "klib $k <- $built"
          done
          EOF
          # Booting the image ops has just built, by hand, with qemu's gdb stub attached, and
          # asking every processor where it is once the guest stops saying anything -- or once
          # it faults, since nanos's own frame trace came out empty on the fault this race
          # produces. $1 label, $2 the kernel.elf whose symbols match the image, $3 attempts.
          cat > catch-stop.sh <<'EOF'
          #!/bin/bash
          set -o pipefail
          label="$1"; kelf="$2"; attempts="${3:-6}"
          img="$HOME/.ops/images/zgcprobe"
          [ -f "$kelf" ] || { echo "::warning::no kernel.elf to symbolise ${label} with"; exit 0; }
          [ -f "$img" ] || { echo "::warning::no image left to boot for ${label}"; exit 0; }
          run_qemu() {
            qemu-system-x86_64 -machine q35,accel=tcg -cpu max -smp 4 -m 2G \
              -device pcie-root-port,port=0x10,chassis=1,id=pci.1,bus=pcie.0,multifunction=on,addr=0x3 \
              -device pcie-root-port,port=0x11,chassis=2,id=pci.2,bus=pcie.0,addr=0x3.0x6 \
              -device virtio-scsi-pci,bus=pci.2,addr=0x0,id=scsi0 \
              -device scsi-hd,bus=scsi0.0,drive=hd0 \
              -drive file="$img",format=raw,if=none,id=hd0 \
              -vga none -device isa-debug-exit -display none -serial stdio -s
          }
          for attempt in $(seq 1 "$attempts"); do
            echo "=== ${label}: attempt ${attempt} ==="
            : > "${label}-hang.serial"
            run_qemu > "${label}-hang.serial" 2>&1 &
            qpid=$!
            stalls=0; last=0
            for _ in $(seq 1 60); do
              sleep 2
              grep -q '^PROBE DONE' "${label}-hang.serial" && break
              grep -q 'no fault handler' "${label}-hang.serial" && break
              now=$(wc -c < "${label}-hang.serial")
              if [ "$now" = "$last" ]; then stalls=$((stalls + 1)); else stalls=0; fi
              last=$now
              # The whole race takes about a second of guest time, so nothing new for twenty
              # is not a slow guest.
              [ "$stalls" -ge 10 ] && break
            done
            if grep -q '^PROBE DONE' "${label}-hang.serial"; then
              echo "${label}: the race finished this time"
              kill "$qpid" 2>/dev/null || true
              wait "$qpid" 2>/dev/null || true
              continue
            fi
            echo "--- ${label}: it stopped here ---"
            tail -3 "${label}-hang.serial"
            gdb -batch -n "$kelf" \
              -ex 'target remote :1234' \
              -ex 'info threads' \
              -ex 'thread apply all bt' \
              -ex 'thread apply all info registers rip rsp' 2>&1 | tee "${label}-hang.bt"
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            {
              echo "### Where every processor was when ${label} stopped"
              echo ""
              echo '```'
              sed -n '1,120p' "${label}-hang.bt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${label} stopped the guest; the backtrace of each processor is in ${label}-hang.bt"
            exit 0
          done
          echo "${label}: it finished in all ${attempts} attempts under the gdb stub"
          EOF
          chmod +x swap-kernel.sh catch-stop.sh

      - name: Prime ops nightly cache
        run: |
          # ops needs a package pulled once to populate the nightly kernel slot;
          # any package works, the JRE one is already cached across these jobs.
          ops pkg get "${{ matrix.package }}" --arch ${{ matrix.ops_arch }} --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"

      # The same race against the kernel upstream is at: the punch has no dealloc method there
      # and keeps the old behaviour of zeroing the pages where they are. It answers one question
      # -- whether the race stops the guest without this change as well -- and it is reported,
      # never gated, since the checks it prints are the ones this change exists to flip.
      - name: Run the race on the kernel without this change (the "before")
        run: |
          set -o pipefail
          strip_ansi() { sed -u 's/\x1b\[[0-9;]*m//g'; }
          ./swap-kernel.sh /tmp/kernel-baseline.img /tmp/base/output
          cat > probe-before.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["concurrent"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          # Short, because the two ways this ends are both quick: the race takes a couple of
          # seconds, and a guest that faults stops saying anything at all -- waiting out a long
          # timeout after that only spends the job's time.
          t0=$SECONDS
          timeout 120 ops run ./zgcprobe --nightly -c probe-before.json 2>&1 \
            | strip_ansi | tee probe-before.log || true
          echo "TIMING before $((SECONDS - t0))s" | tee -a probe-timing.log
          if grep -q '^PROBE DONE' probe-before.log; then
            echo "the race runs to the end without this change"
          else
            echo "::warning::the race does not finish without this change either, so it is not this change that stops it"
            # And now it can be asked where, which is what the baseline was built here for.
            if [ "${{ matrix.arch }}" = x64 ]; then
              ./catch-stop.sh before "${BASE_ELF}" 3
            fi
          fi
          tail -3 probe-before.log

      - name: Swap in the kernel and the klibs built here
        run: ./swap-kernel.sh /tmp/kernel-candidate.img output

      - name: Run the probe inside nanos, stock and with the klibs
        run: |
          set -o pipefail
          # -u, or sed block-buffers on a pipe and a guest that hangs shows an
          # empty section instead of the line it stopped on.
          strip_ansi() { sed -u 's/\x1b\[[0-9;]*m//g'; }
          # Four processors, not one: every bug this probe has caught so far was a
          # page whose owner changed under someone else, and a uniprocessor guest
          # reaches only the interleavings preemption happens to produce -- the
          # rendezvous in page_invalidate_sync() waits for nobody at all there.
          cat > probe-stock.json <<'EOF'
          {
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          cat > probe-klib.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          cat > probe-concurrent.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["concurrent"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          cat > probe-cycles.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["cycles"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          cat > probe-maps.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["maps"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          # Same small guest as the pressure run, and for the same reason: the
          # eviction this asks about only happens when the memory is really gone.
          cat > probe-evict.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["evict"],
            "RunConfig": { "Memory": "512M", "CPUs": 4 }
          }
          EOF
          # Small guest on purpose: 200M punched out of 512M is only reclaimable
          # if the page cache gives it back, so the allocations that follow
          # answer the question instead of the guest simply having room.
          cat > probe-pressure.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["pressure"],
            "RunConfig": { "Memory": "512M", "CPUs": 4 }
          }
          EOF
          # Each variant is timed. They are emulated, so they are not fast, but a
          # variant that suddenly costs minutes is saying something -- either the
          # guest is doing far more work per operation than the same code does on
          # the host, or it is stuck retrying something -- and without a number per
          # variant the only visible symptom is a job that got slower.
          for v in stock klib concurrent cycles maps evict pressure; do
            echo "=== probe (${v}) ==="
            t0=$SECONDS
            timeout 420 ops run ./zgcprobe --nightly --show-debug --verbose \
              -c "probe-${v}.json" 2>&1 | strip_ansi | tee "probe-${v}.log" || true
            if ! grep -q '^PROBE ' "probe-${v}.log"; then
              echo "--- retry without --show-debug/--verbose (ops flag differences) ---"
              timeout 420 ops run ./zgcprobe --nightly -c "probe-${v}.json" 2>&1 \
                | strip_ansi | tee "probe-${v}.log" || true
            fi
            echo "TIMING ${v} $((SECONDS - t0))s" | tee -a probe-timing.log
          done

          # Two cuts of the same race, each missing one of the two things that could leave a
          # pin behind: one puncher, so no two punches can overlap; and no writer, so nothing
          # puts a range back in the file's map while a punch takes it out. Whichever of them
          # still faults is not the one to blame.
          cat > probe-race1p.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["concurrent", "1", "1"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF
          cat > probe-racenw.json <<'EOF'
          {
            "Klibs": ["tmpfs", "shmem"],
            "Args": ["concurrent", "2", "0"],
            "RunConfig": { "Memory": "2G", "CPUs": 4 }
          }
          EOF

          # The race is the one variant that has ever stopped a guest, and it did not stop the
          # next one: that makes it a frequency, not a fact, and a single run that finishes says
          # nothing about how often one does not. A boot of it costs a couple of seconds, so it
          # is run again and again and the count of those that finished is what gets reported.
          # The timeout is short for the same reason: a round that stops is not going to say
          # anything more, and two of ten stopping at five minutes each is ten minutes of the
          # job spent waiting for a guest that is already gone.
          for i in $(seq 2 10); do
            t0=$SECONDS
            timeout 90 ops run ./zgcprobe --nightly -c probe-concurrent.json 2>&1 \
              | strip_ansi | tee "probe-race-${i}.log" || true
            echo "TIMING race-${i} $((SECONDS - t0))s" | tee -a probe-timing.log
          done

          # And the same number of rounds of each cut, since one round proves nothing about a
          # fault that shows up in one run out of ten.
          for v in race1p racenw; do
            for i in $(seq 1 10); do
              t0=$SECONDS
              timeout 90 ops run ./zgcprobe --nightly -c "probe-${v}.json" 2>&1 \
                | strip_ansi | tee "probe-${v}-${i}.log" || true
              echo "TIMING ${v}-${i} $((SECONDS - t0))s" | tee -a probe-timing.log
            done
          done

      # A guest that has stopped cannot be asked anything from inside it: the watchdog thread
      # says whether it is the guest or a thread that stopped, and it has said the guest, which
      # is where a probe running in that guest runs out of things it can find out. qemu's gdb
      # stub is outside it, so it still answers -- and what each processor is executing, with
      # the symbols of the kernel built here, is what says which lock is held by whom.
      - name: Catch the race where it stops, and ask every processor where it is
        if: matrix.arch == 'x64'
        run: |
          set -o pipefail
          # The image the stub gets has to carry the kernel whose symbols it will be read
          # with, so the diagnostic build goes into ops's slot and one run rebuilds the image
          # around it. That run is the race, so it may well stop too; it is not being measured
          # here, only used to produce the image. Note this kernel is laid out differently from
          # the one measured above, so the rate at which it stops need not be the same.
          ./swap-kernel.sh /tmp/kernel-diag.img /tmp/diag/output
          timeout 90 ops run ./zgcprobe --nightly -c probe-concurrent.json > /dev/null 2>&1 || true
          ./catch-stop.sh race "${DIAG_ELF}" 6

      - name: Report the stock-vs-klib capability matrix
        run: |
          res() { # $1=variant $2=check -> "VERDICT detail"
            grep "^PROBE $2 " "probe-$1.log" 2>/dev/null | head -1 | sed -E 's/^PROBE +[^ ]+ +//'
          }
          checks=$(cat probe-stock.log probe-klib.log 2>/dev/null \
                   | grep '^PROBE ' | grep -v '^PROBE DONE' | awk '{print $2}' | awk '!seen[$0]++')
          echo "--- stock ---"; grep '^PROBE' probe-stock.log || true
          echo "--- klib  ---"; grep '^PROBE' probe-klib.log  || true
          {
            echo "## ZGC backing-store primitives, measured inside nanos"
            echo ""
            echo "| check | stock image | + tmpfs/shmem klibs |"
            echo "|---|---|---|"
            for c in $checks; do
              echo "| \`$c\` | $(res stock "$c" | cut -c1-90) | $(res klib "$c" | cut -c1-90) |"
            done
            echo ""
            echo "With the klibs, \`memfd_create\` succeeds and the remaining checks run against the memfd itself"
            echo "(the tmpfs klib's pages) instead of a file on the root filesystem — which is the path ZGC takes."
            echo "\`punch_hole_reclaims\` is the claim of the uncommit change: the pages come back at the punch,"
            echo "with the file still mapped, rather than only when it is closed (\`memory_returned\`)."
            echo "It is expected to fail on the stock column, where the root filesystem has no dealloc method"
            echo "and keeps the previous zero-in-place behaviour."
            echo ""
            echo "### Punching while the pages are in use, and over and over"
            echo ""
            echo '```'
            grep -E '^PROBE (concurrent|cpus)' probe-concurrent.log 2>/dev/null || echo "(no output)"
            # The last few heartbeats, which is where a run that stopped mid-race stopped.
            grep -E '^RACE ' probe-concurrent.log 2>/dev/null | tail -5
            grep -E '^(CYCLE|PROBE cycles)' probe-cycles.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### The same race on the unpatched nightly kernel"
            echo ""
            echo "Run before the kernel and the klibs of this ref are swapped in, so the punch there"
            echo "still zeroes its pages in place. Its checks are expected to fail — it is here to say"
            echo "whether the race itself stops the guest without this change as well."
            echo '```'
            grep -E '^(PROBE (concurrent|DONE)|RACE alive)' probe-before.log 2>/dev/null | tail -6 \
              || echo "(no output)"
            echo '```'
            echo ""
            echo "### What each variant cost"
            echo ""
            echo '```'
            cat probe-timing.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### With more mappings of the file than the punch unmaps in one batch"
            echo ""
            echo "ZGC keeps roughly three mappings per granule of its heap, which saturates the"
            echo "batched walk the punch has to resume through a cursor. A mapping the walk skipped"
            echo "keeps an entry for a page that has just been freed, so it would read back the old"
            echo "bytes instead of the hole."
            echo '```'
            grep -E '^PROBE many_maps' probe-maps.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### The shapes of hole that reach a branch of their own"
            echo ""
            echo "A hole with no whole page in it gives nothing back and only zeroes bytes; a hole"
            echo "spanning more ranges of the file's map than the punch removes per pass makes that"
            echo "pass repeat; and a page a private mapping holds across the punch cannot be freed,"
            echo "so it is zeroed in place and the file still reads as a hole through every other view."
            echo "What the private mapping itself then sees is reported, not gated."
            echo '```'
            grep -E '^PROBE punch_(subpage|many_ranges|private)' probe-klib.log 2>/dev/null \
              || echo "(no output)"
            echo '```'
            echo ""
            echo "### Does a page written only through a mapping survive memory pressure?"
            echo ""
            echo "Open question, reported rather than gated, and about the data rather than the memory:"
            echo "a tmpfs page dirtied through a mapping alone is never seen as dirty on aarch64, so it"
            echo "is never written back nor pinned — which is what a clean, evictable page looks like,"
            echo "while a tmpfs read zero-fills. That is the shape of a ZGC heap. Nothing is punched here."
            echo '```'
            grep -E '^(EVICT|PROBE evict)' probe-evict.log 2>/dev/null || echo "(no output)"
            echo '```'
            echo ""
            echo "### Under memory pressure (512M guest, 200M punched out of a memfd)"
            echo ""
            echo "Does a punched hole give its pages back, and can the guest then use them for something else?"
            echo '```'
            grep -E '^(PRESSURE|PROBE (pressure_alloc|punch_frees_pagecache|pressure_setup))' probe-pressure.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for v in stock klib concurrent cycles maps; do
            grep -q '^PROBE DONE' "probe-${v}.log" || {
              echo "::error::probe (${v}) did not reach the end — it crashed or never booted; see probe-${v}.log"; fail=1; }
          done

          # A race that stopped has to say where. The watchdog beats once a second whatever the
          # punchers are doing, so no beat at all means the guest itself is gone, while a beat
          # that keeps coming while the touch count stands still means the threads faulting
          # pages are blocked on something a punch is holding. The same race on the unpatched
          # kernel is printed beside it, because a stop there is not this change's doing.
          if ! grep -q '^PROBE DONE' probe-concurrent.log; then
            echo "--- the last thing the race said ---"
            grep -E '^RACE ' probe-concurrent.log | tail -8
            echo "--- the same race, unpatched kernel ---"
            grep -E '^(RACE alive|PROBE (concurrent|DONE))' probe-before.log 2>/dev/null | tail -4
            grep -q '^PROBE DONE' probe-before.log 2>/dev/null \
              && echo "note: it does finish without this change" \
              || echo "note: it does not finish without this change either"
          fi
          # Not in that list: the eviction question is reported rather than gated, and
          # its guest is the one most likely to die of the thing it is measuring -- it
          # holds the whole file while it squeezes, where the pressure run has already
          # punched what it filled.
          grep -q '^PROBE DONE' probe-evict.log || \
            echo "::warning::the eviction probe did not reach the end — most likely the guest ran out of memory; see probe-evict.log"

          # Not a gate: ops may not honour the CPUs setting, and a uniprocessor run
          # still checks everything else -- but it must not pass for a multiprocessor one.
          cpus=$(grep -h '^PROBE cpus_online' probe-klib.log 2>/dev/null | awk '{print $4}')
          if [ "${cpus:-1}" -le 1 ]; then
            echo "::warning::the guest reported ${cpus:-?} processor, so nothing here ran with real parallelism"
          else
            echo "PASS: guest is multiprocessor (${cpus})"
          fi
          # The claim under test: the klib actually delivers the syscall.
          if grep -q '^PROBE memfd_create *PASS' probe-klib.log; then
            echo "PASS: memfd_create works once the shmem klib is loaded"
          else
            echo "::error::memfd_create still fails with the klibs loaded: $(res klib memfd_create)"
            fail=1
          fi

          # What the uncommit change has to deliver, on the memfd path only: the
          # root filesystem has no dealloc method and is expected to keep zeroing
          # its pages in place, so the stock column is left as the contrast.
          for c in punch_hole_frees_blocks punch_hole_reclaims punch_hole_refault punch_partial \
                   punch_partial_blocks punch_overhang_head punch_overhang_tail \
                   punch_subpage punch_subpage_blocks punch_many_ranges \
                   punch_private_shared_zero; do
            if grep -q "^PROBE ${c} *PASS" probe-klib.log; then
              echo "PASS: ${c}"
            else
              echo "::error::${c} failed on the memfd: $(res klib "$c")"
              fail=1
            fi
          done

          # Reported, not gated: what a private mapping sees of a hole punched under it is about
          # how nanos implements private file mappings, not about this change. The gate above is
          # the part that is this change's claim -- that the page was not freed under it.
          if grep -q '^PROBE punch_private_view *PASS' probe-klib.log; then
            echo "PASS: a private mapping sees the hole the way Linux reports it"
          else
            echo "::warning::a private mapping of a punched file does not behave as it does on Linux: $(res klib punch_private_view)"
          fi

          # Punching while other threads fault the same pages, and doing it over and
          # over: the first covers the "still referenced, zero it instead of freeing
          # it" branch, which no sequential check reaches, and the second bounds what
          # a commit/uncommit cycle keeps.
          echo "--- concurrent ---"; grep -E '^(PROBE (concurrent|cpus)|RACE )' probe-concurrent.log | tail -20 || true
          echo "--- cycles ---"; grep -E '^(CYCLE|PROBE cycles)' probe-cycles.log || true
          for c in concurrent_setup concurrent_no_corruption; do
            if grep -q "^PROBE ${c} *PASS" probe-concurrent.log; then
              echo "PASS: ${c}"
            else
              echo "::error::${c} failed: $(res concurrent "$c")"
              fail=1
            fi
          done
          # And every repetition of it, counted: one round that finishes is not evidence about
          # a stop that happens some of the time.
          rounds=0; finished=0
          for f in probe-concurrent.log probe-race-*.log; do
            [ -f "$f" ] || continue
            rounds=$((rounds + 1))
            if grep -q '^PROBE DONE' "$f" &&
               grep -q '^PROBE concurrent_no_corruption *PASS' "$f"; then
              finished=$((finished + 1))
            else
              echo "::error::the race did not finish in ${f}"
              grep -E '^RACE ' "$f" | tail -4
              fail=1
            fi
          done
          echo "race: ${finished} of ${rounds} rounds finished"
          printf '\n**The race was run %d times, and %d of them finished.**\n' \
            "$rounds" "$finished" >> "$GITHUB_STEP_SUMMARY"

          # Which of the two things the fault needs. Reported and never gated: these are cuts of
          # the race made to be compared with the full one, not claims about the change.
          {
            echo ""
            echo "### Which of the two the fault needs"
            echo ""
            echo "| race | rounds | finished | faulted |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for v in race race1p racenw; do
            case "$v" in
              race)   files="probe-concurrent.log probe-race-*.log"; what="two punchers, writer" ;;
              race1p) files="probe-race1p-*.log";  what="one puncher, writer" ;;
              racenw) files="probe-racenw-*.log";  what="two punchers, no writer" ;;
            esac
            n=0; ok=0; flt=0
            for f in $files; do
              [ -f "$f" ] || continue
              n=$((n + 1))
              grep -q '^PROBE DONE' "$f" && ok=$((ok + 1))
              grep -q 'no fault handler' "$f" && flt=$((flt + 1))
            done
            echo "${what}: ${ok} of ${n} finished, ${flt} faulted"
            echo "| ${what} | ${n} | ${ok} | ${flt} |" >> "$GITHUB_STEP_SUMMARY"
          done
          if grep -q '^PROBE cycles_reclaim *PASS' probe-cycles.log; then
            echo "PASS: cycles_reclaim"
          else
            echo "::error::cycles_reclaim failed: $(res cycles cycles_reclaim)"
            fail=1
          fi

          # More mappings than one batch of the punch's walk, so that the cursor it
          # resumes from is exercised at all.
          echo "--- maps ---"; grep -E '^PROBE many_maps' probe-maps.log || true
          for c in many_maps_setup many_maps_punch many_maps_refault; do
            if grep -q "^PROBE ${c} *PASS" probe-maps.log; then
              echo "PASS: ${c}"
            else
              echo "::error::${c} failed: $(res maps "$c")"
              fail=1
            fi
          done

          # Reported, not gated: whether a page written only through a mapping survives
          # eviction is an older question than this change, and a failure here would say
          # nothing about the punch. It must be visible rather than buried, though.
          echo "--- evict ---"; grep -E '^(EVICT|PROBE evict)' probe-evict.log || true
          if grep -q '^PROBE evict_keeps_data *PASS' probe-evict.log; then
            echo "PASS: pages written through the mapping alone survived the pressure"
          else
            echo "::warning::a page written only through a mapping did not survive memory pressure: $(res evict evict_keeps_data)"
          fi

          echo "--- pressure ---"; grep -E '^(PRESSURE|PROBE p)' probe-pressure.log || true
          if ! grep -q '^PRESSURE baseline' probe-pressure.log; then
            echo "::error::the pressure run produced no measurement — see probe-pressure.log"
            fail=1
          else
            # A guest that runs out of memory here truncates its own log, so a
            # missing result counts as a failure just like an explicit one.
            for c in punch_frees_pagecache pressure_alloc; do
              if grep -q "^PROBE ${c} *PASS" probe-pressure.log; then
                echo "PASS: ${c}"
              else
                echo "::error::${c} did not pass under pressure: $(res pressure "$c")"
                fail=1
              fi
            done
          fi
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgc-backing-store-probe-${{ matrix.arch }}
          path: |
            zgcprobe.c
            probe-*.log
            probe-*.json
            *-hang.serial
            *-hang.bt

  # ====================================================================
  # nanos's own runtime test for memfd, extended with the fallocate cases the
  # dispatch change makes reachable (allocate and keep-size on a memfd, and the
  # seals they have to honour). Running it through `make run-noaccel` builds the
  # image the way the upstream suite does -- its manifest already loads the
  # tmpfs and shmem klibs, and both are built from this ref -- so this is the
  # patch under nanos, not under Linux.
  # ====================================================================
  runtime-test-shmem:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the kernel under test)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-aarch64

      - name: Run the upstream shmem runtime test under TCG
        run: |
          set -o pipefail
          # Build the image separately from booting it: a build error has to
          # fail this step loudly, while the qemu exit status must be tolerated
          # (the guest exits through the debug-exit device, not with 0).
          make -j"$(nproc)" image TARGET=shmem PLATFORM=virt 2>&1 | tail -30
          ls -l output/test/runtime/bin/shmem output/image/disk.raw
          timeout 900 make run-noaccel TARGET=shmem PLATFORM=virt 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee shmem-test.log || true
          echo "--- output del guest, ultime righe ---"
          tail -5 shmem-test.log

      - name: Assert the test passed inside the guest
        run: |
          if grep -qE 'failed at|Error: ' shmem-test.log; then
            echo "::error::shmem runtime test failed inside nanos:"
            grep -E 'failed at|Error: ' shmem-test.log | head -5
            exit 1
          fi
          grep -q 'Shared memory tests OK' shmem-test.log || {
            echo "::error::shmem runtime test did not report success — see shmem-test.log"
            tail -20 shmem-test.log
            exit 1; }
          echo "PASS: $(grep 'Shared memory tests OK' shmem-test.log | head -1)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shmem-runtime-test
          path: shmem-test.log
