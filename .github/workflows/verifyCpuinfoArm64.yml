name: cpuinfo identity A/B (arm64)

# Proves the /proc/cpuinfo synthesis patch makes the guest core identifiable by
# running the SAME os+cpu / PrintFlagsFinal probe inside two nanos images:
#   * baseline  = the STOCK nanos ops ships today (`--nightly`) — no
#                 /proc/cpuinfo, so HotSpot reports "0x00:0x0:0x000:0" and
#                 "/proc/cpuinfo: <Not Available>".
#   * candidate = the kernel built from THIS ref (the cpuinfo patch) —
#                 /proc/cpuinfo synthesized from MIDR_EL1, so the core identity
#                 (implementer:variant:part:revision) is real.
#
# TCG on the free hosted arm64 runner is enough: the identity comes from the
# emulated CPU's MIDR_EL1, which the patch reads at EL1 — no KVM needed.
# (GitHub-hosted arm64 runners do NOT expose /dev/kvm.)
#
# The gate asserts the AFTER identity line is no longer the all-zero "unknown
# core" line. Whether an identity-gated tuning (UseSIMDForMemoryOps, ...) flips
# depends on the emulated -cpu matching a recognized model, so those are
# reported for observation, not gated.

on:
  push:
    branches: [ci/cpuinfo-verify-arm64]
    paths:
      - 'src/aarch64/kernel_machine.h'
      - 'src/unix/special.c'
      - '.github/workflows/verifyCpuinfoArm64.yml'
  workflow_dispatch:
    inputs:
      jre_package:
        description: "HotSpot JRE ops package"
        default: "AngeloRubens/TemurinJREarm64Linux:25.0.1"

env:
  JRE_PACKAGE: ${{ inputs.jre_package || 'AngeloRubens/TemurinJREarm64Linux:25.0.1' }}

jobs:
  correctness:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the patch candidate)
        uses: actions/checkout@v4

      - name: Note environment (TCG expected here)
        run: |
          echo "Proves the core identity goes from 0x00:0x0:0x000:0 -> real MIDR under TCG."
          [ -e /dev/kvm ] && echo "note: /dev/kvm present, but this job runs TCG anyway." \
                          || echo "no /dev/kvm (expected on hosted arm64) — fine, TCG it is."

      - name: Install build deps
        run: |
          # ops's get.sh gates on `which qemu-system-x86_64` even on arm64, so
          # the qemu-system metapackage (pulls qemu-system-x86) is required just
          # to satisfy that check; qemu-system-arm/aarch64 actually boot the
          # arm64 guest. Mirrors the known-good testJreArm64 job.
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build candidate kernel (this ref = the patch)
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Prime ops nightly cache and capture the STOCK kernel as baseline
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "ops kernel slot: $OPSK"
          cp "$OPSK" /tmp/kernel-baseline.img
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          ls -l /tmp/kernel-baseline.img

      - name: Run A/B under TCG (stock baseline then patched candidate)
        run: |
          set -eo pipefail
          run_one () {
            local kimg="$1" tag="$2" out="$3"
            cp "$kimg" "$OPSK"
            echo "=== running $tag (kernel=$kimg) ==="
            ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
              --show-debug --verbose \
              -a -Xlog:os+cpu=debug \
              -a -XX:+UnlockDiagnosticVMOptions -a -XX:+PrintFlagsFinal \
              -a -version 2>&1 | tee "$out"
          }
          run_one /tmp/kernel-baseline.img  BASELINE  base.log
          run_one /tmp/kernel-candidate.img CANDIDATE cand.log

      - name: Assert core identity is synthesized (0x00:0x0:0x000:0 -> real MIDR)
        run: |
          idre='0x[0-9a-fA-F]{2}:0x[0-9a-fA-F]+:0x[0-9a-fA-F]{3}:[0-9]+'
          before_id=$(grep -oE "$idre" base.log | head -1 || true)
          after_id=$(grep -oE "$idre" cand.log | head -1 || true)
          echo "baseline  identity: ${before_id:-<not found>}"
          echo "candidate identity: ${after_id:-<not found>}"

          [ -s cand.log ] || { echo "::error::candidate produced no output — the JVM did not boot on our kernel. See cand.log."; exit 1; }
          if [ -z "$after_id" ]; then
            echo "::error::candidate os+cpu produced no identity line — check cand.log"
            exit 1
          fi
          if [ "$after_id" = "0x00:0x0:0x000:0" ]; then
            echo "::error::candidate identity still all-zero — /proc/cpuinfo not being read by HotSpot"
            exit 1
          fi
          # Baseline is expected (but not required) to be the all-zero unknown core.
          if [ "$before_id" != "0x00:0x0:0x000:0" ]; then
            echo "::warning::baseline identity is '${before_id}', not the expected all-zero — stock nanos may already expose cpuinfo, or ops shipped a newer kernel."
          fi
          echo "PASS: core identified after the patch ($after_id)"

      # ---- Boot the CANDIDATE kernel under recognized cores so the identity-gated
      #      tunings actually fire. ops hardcodes `-cpu max` (implementer 0x00 =
      #      unknown vendor), so we reuse ops's assembled image + qemu cmdline but
      #      boot it by hand with a chosen -cpu. neoverse-n1 == Ampere Altra /
      #      Graviton2 (impl 0x41, part 0xd0c); AmpereOne is emulated by overriding
      #      MIDR on -cpu max (impl 0xc0, part 0xac3 = CPU_AMPERE/CPU_MODEL_AMPERE_1).
      - name: Boot candidate under neoverse-n1 and AmpereOne
        run: |
          set -o pipefail
          strip_ansi() { sed 's/\x1b\[[0-9;]*m//g'; }
          # Recover ops's exact qemu invocation (it printed it under --show-debug).
          TMPL=$(strip_ansi < cand.log | grep -oE 'qemu-system-aarch64 .*-serial stdio' | head -1)
          if [ -z "$TMPL" ]; then
            echo "::error::could not recover ops qemu cmdline from cand.log"; exit 1
          fi
          echo "ops qemu template:"; echo "  $TMPL"

          echo "== available aarch64 CPU models =="
          qemu-system-aarch64 -machine virt -cpu help 2>/dev/null | awk '{print $2}' | tr '\n' ' '; echo

          # label|cpu-spec  (neoverse-n1 falls back to neoverse-n2 if the runner's
          # qemu lacks it; AmpereOne uses the always-present max + midr override)
          N1=neoverse-n1
          qemu-system-aarch64 -machine virt -cpu help 2>/dev/null | grep -qw neoverse-n1 || N1=neoverse-n2
          MODELS=(
            "neoverse-n1|${N1}"
            "ampereone|max,midr=0xc00fac30"
          )

          for entry in "${MODELS[@]}"; do
            label="${entry%%|*}"; spec="${entry##*|}"
            cmd=$(echo "$TMPL" \
              | sed -E "s#-kernel [^ ]+#-kernel /tmp/kernel-candidate.img#" \
              | sed -E "s#-cpu [^ ]+#-cpu ${spec}#")
            echo "=== boot ${label} (-cpu ${spec}) ==="
            echo "  $cmd"
            timeout 300 bash -c "$cmd" 2>&1 | strip_ansi | tee "run-${label}.txt" || true
          done

      - name: Summarize + assert identity-gated tunings by CPU model
        run: |
          idre='0x[0-9a-fA-F]{2}:0x[0-9a-fA-F]+:0x[0-9a-fA-F]{3}:[0-9]+'
          val() { # $1=flag $2=file  -> extract value
            grep -iE "[[:space:]]$1[[:space:]]+[:=]" "$2" 2>/dev/null \
              | grep -oiE '(true|false|isb|yield|none|[0-9]+)' | head -1
          }
          {
            echo "## Identity-gated tunings by emulated CPU (candidate kernel, TCG)"
            echo ""
            echo "| CPU (-cpu) | identity | UseSIMDForMemoryOps | OnSpinWaitInst | AlwaysMergeDMB | UseCryptoPmullForCRC32 | CodeEntryAlignment |"
            echo "|---|---|--:|--:|--:|--:|--:|"
            for f in "cand.log:max (ops, impl 0x00 = unknown)" "run-neoverse-n1.txt:neoverse-n1 (Ampere Altra / Graviton2)" "run-ampereone.txt:AmpereOne (midr 0xc0/0xac3)"; do
              file="${f%%:*}"; name="${f##*:}"
              id=$(grep -oE "$idre" "$file" 2>/dev/null | head -1 || echo '-')
              echo "| $name | \`${id:-–}\` | $(val UseSIMDForMemoryOps "$file") | $(val OnSpinWaitInst "$file") | $(val AlwaysMergeDMB "$file") | $(val UseCryptoPmullForCRC32 "$file") | $(val CodeEntryAlignment "$file") |"
            done
            echo ""
            echo "Expected: on the recognized cores UseSIMDForMemoryOps flips **true**, OnSpinWaitInst→**isb**, AlwaysMergeDMB→**false**."
          } >> "$GITHUB_STEP_SUMMARY"

          # Gate: on a recognized core the memory-ops tuning MUST turn on. This is
          # the concrete downstream proof that /proc/cpuinfo makes the core usable.
          fail=0
          for file in run-neoverse-n1.txt run-ampereone.txt; do
            [ -s "$file" ] || { echo "::warning::$file empty (did the guest boot on this -cpu?)"; continue; }
            v=$(val UseSIMDForMemoryOps "$file")
            id=$(grep -oE "$idre" "$file" | head -1 || echo '?')
            echo "$file: identity=$id UseSIMDForMemoryOps=$v"
            if [ "$v" != "true" ]; then
              echo "::error::$file: UseSIMDForMemoryOps=$v (expected true on a recognized core)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "PASS: identity-gated tunings fired on recognized cores"
          exit $fail

      - name: Summarize (before vs after)
        if: always()
        run: |
          idre='0x[0-9a-fA-F]{2}:0x[0-9a-fA-F]+:0x[0-9a-fA-F]{3}:[0-9]+'
          {
            echo "## /proc/cpuinfo synthesis — before vs after (arm64, TCG)"
            echo ""
            echo "Package: \`${JRE_PACKAGE}\`"
            echo ""
            echo "### Core identity line (\`-Xlog:os+cpu\`)"
            echo "- **baseline** : \`$(grep -oE "$idre" base.log | head -1 || echo '<not found>')\`"
            echo "- **candidate**: \`$(grep -oE "$idre" cand.log | head -1 || echo '<not found>')\`"
            echo ""
            echo "### os+cpu / cpuinfo availability"
            echo '```'
            echo "-- BASELINE --"
            grep -iE 'CPU: total|/proc/cpuinfo|Online cpus' base.log | head -6 || echo "(none)"
            echo "-- CANDIDATE --"
            grep -iE 'CPU: total|/proc/cpuinfo|Online cpus' cand.log | head -6 || echo "(none)"
            echo '```'
            echo "### Identity-gated tunings (flip only when the emulated core is a recognized model)"
            echo "| flag | baseline | candidate |"
            echo "|---|---|---|"
            for k in UseSIMDForMemoryOps OnSpinWaitInst AlwaysMergeDMB UseCryptoPmullForCRC32 CodeEntryAlignment AvoidUnalignedAccesses; do
              b=$(grep -iE "[[:space:]]$k[[:space:]]+[:=]" base.log | grep -oiE '(true|false|isb|yield|none|[0-9]+)' | head -1 || echo '?')
              c=$(grep -iE "[[:space:]]$k[[:space:]]+[:=]" cand.log | grep -oiE '(true|false|isb|yield|none|[0-9]+)' | head -1 || echo '?')
              echo "| $k | ${b:-?} | ${c:-?} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpuinfo-identity-ab-tcg
          path: |
            base.log
            cand.log
            run-neoverse-n1.txt
            run-ampereone.txt

  # ====================================================================
  # SIMD copy codegen correctness. With UseSIMDForMemoryOps on (recognized
  # core) HotSpot's arraycopy/fill stub emits 32-byte Q-register ldp/stp.
  # Run a self-verifying workload (System.arraycopy on-heap + Unsafe.copyMemory
  # off-heap via DirectByteBuffer) under max / neoverse-n1 / AmpereOne on the
  # patched kernel and assert it prints COPY OK with an identical checksum
  # across cores -- i.e. the SIMD path yields the same bytes as the scalar one
  # (no corruption) and never SIGILLs (the NEON runs at EL0, state is saved).
  # ====================================================================
  simd-copy-correctness:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the patch candidate)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system qemu-user qemu-user-static qemu-system-arm \
            qemu-system-aarch64 binfmt-support qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Set up a JDK to compile the workload
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile CopyBench (self-verifying arraycopy / Unsafe copy)
        run: |
          cat > CopyBench.java <<'EOF'
          public class CopyBench {
              static long fnv(byte[] b, int from, int to) {
                  long h = 0xcbf29ce484222325L;
                  for (int i = from; i < to; i++) { h ^= (b[i] & 0xff); h *= 0x100000001b3L; }
                  return h;
              }
              public static void main(String[] args) {
                  final int N = 128 * 1024;
                  final int iters = Integer.getInteger("iters", 4000);
                  byte[] src = new byte[N];
                  long s = 0x9E3779B97F4A7C15L;
                  for (int i = 0; i < N; i++) { s = s * 6364136223846793005L + 1442695040888963407L; src[i] = (byte) (s >>> 56); }
                  long ref = fnv(src, 0, N);
                  boolean ok = true;
                  byte[] dst = new byte[N];
                  for (int it = 0; it < iters; it++) {
                      int off = it & 31, len = N - off - 64;
                      System.arraycopy(src, off, dst, off, len);
                  }
                  System.arraycopy(src, 0, dst, 0, N);
                  if (fnv(dst, 0, N) != ref) { ok = false; System.out.println("HEAP MISMATCH"); }
                  try {
                      java.nio.ByteBuffer sb = java.nio.ByteBuffer.allocateDirect(N);
                      java.nio.ByteBuffer db = java.nio.ByteBuffer.allocateDirect(N);
                      sb.put(src); sb.flip();
                      for (int it = 0; it < iters; it++) { db.clear(); sb.rewind(); db.put(sb); }
                      byte[] out = new byte[N]; db.flip(); db.get(out);
                      if (fnv(out, 0, N) != ref) { ok = false; System.out.println("OFFHEAP MISMATCH"); }
                  } catch (Throwable t) { ok = false; System.out.println("OFFHEAP EX: " + t); }
                  System.out.println("COPY " + (ok ? "OK" : "FAIL") + " ref=" + Long.toHexString(ref));
              }
          }
          EOF
          javac --release 11 -d . CopyBench.java
          ls -l CopyBench.class

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build candidate kernel (this ref = the patch)
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Write ops workload config
        run: |
          cat > copy-config.json <<EOF
          {
            "Args": ["-Xlog:os+cpu", "-Diters=4000", "-cp", "/", "CopyBench"],
            "Files": ["CopyBench.class"],
            "RunConfig": { "Memory": "2G" }
          }
          EOF
          cat copy-config.json

      - name: Prime ops nightly + run BASELINE (stock kernel, SIMD off)
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::no ops nightly kernel.img"; exit 1; }
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
            --show-debug --verbose -c copy-config.json 2>&1 \
            | sed 's/\x1b\[[0-9;]*m//g' | tee copy-baseline.log

      - name: Boot workload on candidate kernel (max / neoverse-n1 / AmpereOne)
        run: |
          set -o pipefail
          strip_ansi() { sed 's/\x1b\[[0-9;]*m//g'; }
          TMPL=$(strip_ansi < copy-baseline.log | grep -oE 'qemu-system-aarch64 .*-serial stdio' | head -1)
          [ -n "$TMPL" ] || { echo "::error::could not recover ops qemu cmdline"; exit 1; }
          N1=neoverse-n1
          qemu-system-aarch64 -machine virt -cpu help 2>/dev/null | grep -qw neoverse-n1 || N1=neoverse-n2
          MODELS=( "max|max" "neoverse-n1|${N1}" "ampereone|max,midr=0xc00fac30" )
          for entry in "${MODELS[@]}"; do
            label="${entry%%|*}"; spec="${entry##*|}"
            cmd=$(echo "$TMPL" \
              | sed -E "s#-kernel [^ ]+#-kernel /tmp/kernel-candidate.img#" \
              | sed -E "s#-cpu [^ ]+#-cpu ${spec}#")
            echo "=== boot ${label} (-cpu ${spec}) ==="
            timeout 300 bash -c "$cmd" 2>&1 | strip_ansi | tee "copy-${label}.log" || true
          done

      - name: Assert copies correct on every core (no crash, no corruption)
        run: |
          fail=0
          refs=""
          for f in copy-baseline.log copy-max.log copy-neoverse-n1.log copy-ampereone.log; do
            [ -s "$f" ] || { echo "::warning::$f empty"; continue; }
            line=$(grep -oE 'COPY (OK|FAIL) ref=[0-9a-f]+' "$f" | head -1)
            id=$(grep -oE '0x[0-9a-fA-F]{2}:0x[0-9a-fA-F]+:0x[0-9a-fA-F]{3}:[0-9]+' "$f" | head -1)
            echo "$f: identity=${id:-?}  ${line:-<no COPY line>}"
            if ! printf '%s' "$line" | grep -q 'COPY OK'; then
              echo "::error::$f did not report COPY OK (crash or corruption?)"
              grep -iE 'MISMATCH|EX:|SIGILL|Invalid|abort|assert' "$f" | head -5 || true
              fail=1
            fi
            r=$(printf '%s' "$line" | grep -oE 'ref=[0-9a-f]+')
            [ -n "$r" ] && refs="$refs $r"
          done
          uniq=$(printf '%s\n' $refs | sort -u | grep -c .)
          if [ "$uniq" -gt 1 ]; then
            echo "::error::copy checksums differ across cores:$refs"
            fail=1
          fi
          {
            echo "## SIMD copy correctness (System.arraycopy + Unsafe.copyMemory)"
            echo ""
            echo "| run | identity | result |"
            echo "|---|---|---|"
            for f in copy-baseline.log copy-max.log copy-neoverse-n1.log copy-ampereone.log; do
              id=$(grep -oE '0x[0-9a-fA-F]{2}:0x[0-9a-fA-F]+:0x[0-9a-fA-F]{3}:[0-9]+' "$f" 2>/dev/null | head -1)
              line=$(grep -oE 'COPY (OK|FAIL) ref=[0-9a-f]+' "$f" 2>/dev/null | head -1)
              echo "| $f | \`${id:-–}\` | ${line:-<none>} |"
            done
            echo ""
            echo "Identical \`ref=\` across cores = the 32-byte SIMD copy path yields the same bytes as scalar (no corruption); a printed COPY line = no SIGILL (NEON runs at EL0, V-state saved)."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] && echo "PASS: copies correct on all cores"
          exit $fail

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-copy-correctness
          path: |
            CopyBench.java
            copy-baseline.log
            copy-max.log
            copy-neoverse-n1.log
            copy-ampereone.log
