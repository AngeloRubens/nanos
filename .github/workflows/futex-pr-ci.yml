name: futex pr ci

# Fork-only checks of the futex requeue change: the futex runtime test, and
# the whole runtime test suite without acceleration.

on:
  push:
    branches: [ futex-fmmap ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 nasm \
            qemu-system qemu-utils

      - name: Build the images
        run: |
          make -j"$(nproc)" kernel PLATFORM=pc
          make -j"$(nproc)" contgen

      - name: Whole runtime test suite
        run: |
          tests="mmap mmap mmap mmap mmap"
          echo "tests: $tests"
          failed=""
          for t in $tests; do
            echo "=== $t"
            if timeout 900 make VCPUS=2 run-noaccel TARGET=$t PLATFORM=pc \
                > "run-$t.log" 2>&1; then
              echo "RESULT $t: ok"
            else
              echo "RESULT $t: failed ($?)"
              failed="$failed $t"
              tail -15 "run-$t.log" | sed 's/\x1b\[[0-9;]*m//g'
            fi
          done
          echo "failed:$failed"
          test -z "$failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-logs
          path: run-*.log
