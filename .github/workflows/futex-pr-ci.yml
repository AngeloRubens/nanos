name: futex pr ci

# Fork-only checks of the futex requeue change: the futex runtime test, and
# the whole runtime test suite without acceleration.

on:
  push:
    branches: [ futex-requeue-pr-ci, 'futex-check-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 nasm \
            qemu-system qemu-utils

      - name: Build the kernel
        run: make -j"$(nproc)" kernel PLATFORM=pc

      - name: Futex runtime test
        run: |
          set -o pipefail
          make -j"$(nproc)" image TARGET=futex PLATFORM=pc 2>&1 | tail -3
          (sleep 330; pkill -f qemu-system) &
          timeout 300 make VCPUS=2 run-noaccel TARGET=futex PLATFORM=pc \
            2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee run-futex.log || true
          echo "test run exit status (124 means timeout 300 expired): ${PIPESTATUS[0]}"
          grep 'requeue test' run-futex.log || true
          grep -q 'All futex tests passed' run-futex.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futex-log
          path: run-futex.log

