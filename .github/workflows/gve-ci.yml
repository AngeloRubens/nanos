# Fork-local CI for the gve driver branch: builds both kernels on Linux
# runners (parity with the development host).  The upstream main.yml does
# the same on macOS but only triggers on feature/** and fix/** branches.
# This file is NOT meant for the upstream PR — drop this commit at PR-prep.
name: gve CI
on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

jobs:
  kernel-pc:
    name: kernel x86_64 (platform/pc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build
        run: make -j$(nproc) kernel PLATFORM=pc

  kernel-virt:
    name: kernel aarch64 (platform/virt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build
        run: make -j$(nproc) kernel PLATFORM=virt

  # Boot smoke: build a minimal image (hw: prints "hello world!" and exits)
  # and boot it under TCG.  QEMU has no gVNIC, so this exercises the gve PCI
  # probe's no-match path: registering init_gve must not break boot when the
  # device is absent (the common case).  isa-debug-exit propagates the
  # program's exit status, so the run target self-checks; the same mechanism
  # the upstream runtime-tests use.
  #
  # The aarch64 boot smoke runs on a NATIVE arm64 runner (free for public
  # repos): there the host carries the arm64 glibc sysroot the dynamically
  # linked hw test needs, the virt kernel builds with the native gcc (no
  # cross toolchain, ARCH == HOST_ARCH), and the boot is genuine aarch64.
  boot-smoke-pc:
    name: QEMU boot smoke x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86
      - name: Boot hw (TCG)
        run: timeout 300 make -j$(nproc) run-noaccel TARGET=hw PLATFORM=pc

  boot-smoke-virt:
    name: QEMU boot smoke aarch64 (native runner)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Boot hw (TCG)
        run: timeout 300 make -j$(nproc) run-noaccel TARGET=hw PLATFORM=virt

  # Host harness that compiles and executes the real DQO datapath
  # (src/gcp/gve/gve_dqo.c) against a software device model — the only
  # pre-hardware test that runs the datapath/lifecycle logic.  Run on both
  # arches (the Makefile selects src/$(uname -m) for the arch primitives), in
  # three modes: plain (functional), ASan+UBSan (memory safety) and
  # ThreadSanitizer (concurrency / data races).
  harness:
    name: DQO harness ${{ matrix.mode }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        mode: [run, sanitize, tsan]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C test/gve ${{ matrix.mode }}

  # Memory-ordering litmus matrix: confirms the driver's barriers are
  # necessary (each one's absence is detectable on the arch that needs it)
  # and that x86 behaves as the assumed TSO control.  Runs the same matrix on
  # x86 and on a native arm64 runner; see test/gve/litmus.c and litmus-check.sh.
  litmus-x86:
    name: ordering litmus x86_64 (TSO control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run litmus matrix
        run: cd test/gve && ITERS=8000000 ./litmus-check.sh

  litmus-arm64:
    name: ordering litmus aarch64 (weak ordering)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Run litmus matrix
        run: cd test/gve && ITERS=8000000 ./litmus-check.sh
