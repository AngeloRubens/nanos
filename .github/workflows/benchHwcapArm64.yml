name: HWCAP20 crypto A/B (arm64)

# Proves the arm64 HWCAP patch (#20) turns HW crypto ON — and keeps the output
# bit-identical — by running the SAME CryptoBench class inside two nanos images:
#   * baseline  = the STOCK nanos ops ships today (`--nightly`) — crypto OFF.
#                 No source build: it's literally what a user gets now.
#   * candidate = the kernel built from THIS ref (the #20 patch) — crypto ON.
#
# TWO jobs, because two different claims need two different environments:
#
#   correctness (TCG, hosted `ubuntu-24.04-arm`, runs on every push)
#     The real deliverable of #20: the JVM's crypto intrinsic flags flip
#     OFF -> ON and the crypto output stays bit-identical. Both are fully
#     provable under emulation — HotSpot reads getauxval(AT_HWCAP), which the
#     patch fills from the ID registers the emulated CPU advertises. No KVM
#     needed, so this gate is always green on the free hosted arm64 runner.
#     (GitHub-hosted arm64 runners do NOT expose /dev/kvm — only x64 do.)
#
#   perf (KVM, opt-in `workflow_dispatch` on a self-hosted arm64 host)
#     The speedup numbers. Perf under TCG is meaningless for a crypto A/B, so
#     this job refuses to run without /dev/kvm and never lands on push. Point
#     it at an Ampere/Graviton host whose runner carries the `runner_label`.

on:
  push:
    branches: [feat/jvm-hwcap-cpu-features]
    paths:
      - 'src/aarch64/unix_machine.h'
      - 'src/aarch64/kernel_machine.h'
      - 'test/jvm/CryptoBench.java'
      - '.github/workflows/benchHwcapArm64.yml'
  workflow_dispatch:
    inputs:
      jre_package:
        description: "HotSpot JRE ops package"
        default: "AngeloRubens/TemurinJREarm64Linux:25.0.1"
      bench_ms:
        description: "Measurement window per algo (ms)"
        default: "3000"
      runner_label:
        description: "perf job only — runner label that MUST expose /dev/kvm"
        default: "arm64-kvm"

env:
  JRE_PACKAGE: ${{ inputs.jre_package || 'AngeloRubens/TemurinJREarm64Linux:25.0.1' }}
  BENCH_MS: ${{ inputs.bench_ms || '3000' }}

jobs:
  # ====================================================================
  # CORRECTNESS — TCG, hosted arm64, every push. Proves flags flip ON and
  # crypto output is bit-identical. No perf numbers (TCG makes them lies).
  # ====================================================================
  correctness:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (this ref = the patch candidate)
        uses: actions/checkout@v4

      - name: Note environment (TCG expected here)
        run: |
          echo "This job proves crypto flags flip OFF->ON + KAT identical under TCG."
          echo "Perf is NOT measured here (see the 'perf' job for KVM numbers)."
          [ -e /dev/kvm ] && echo "note: /dev/kvm present, but this job runs TCG anyway." \
                          || echo "no /dev/kvm (expected on hosted arm64) — fine, TCG it is."

      - name: Install build deps
        run: |
          # ops's get.sh gates on `which qemu-system-x86_64` even on arm64, so
          # install qemu-system-x86 just to satisfy that check; qemu-system-arm
          # provides qemu-system-aarch64, which actually boots the arm64 guest.
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system-x86 qemu-system-arm qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Set up a JDK to compile the benchmark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile CryptoBench (portable bytecode)
        run: |
          javac --release 11 -d bench-classes test/jvm/CryptoBench.java
          ls -l bench-classes/CryptoBench.class

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build candidate kernel (this ref = the patch)
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Write ops bench config
        run: |
          cp bench-classes/CryptoBench.class .
          cat > bench-config.json <<EOF
          {
            "Args": ["-Xlog:os+cpu", "-XX:+PrintFlagsFinal",
                     "-Dbench.ms=${BENCH_MS}", "-cp", "/", "CryptoBench"],
            "Files": ["CryptoBench.class"],
            "RunConfig": { "Memory": "2G" }
          }
          EOF
          cat bench-config.json

      - name: Prime ops nightly cache and capture the STOCK kernel as baseline
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "ops kernel slot: $OPSK"
          cp "$OPSK" /tmp/kernel-baseline.img
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          ls -l /tmp/kernel-baseline.img

      - name: Run A/B under TCG (stock baseline then patched candidate)
        run: |
          set -eo pipefail
          run_one () {
            local kimg="$1" tag="$2" out="$3"
            cp "$kimg" "$OPSK"
            echo "=== running $tag (kernel=$kimg) ==="
            ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
              --show-debug --verbose -c bench-config.json 2>&1 | tee "$out"
          }
          run_one /tmp/kernel-baseline.img  BASELINE  base.log
          run_one /tmp/kernel-candidate.img CANDIDATE cand.log

      - name: Assert correctness identical (patched path must be bit-identical)
        run: |
          extract () { grep -E '(AES-GCM tag|SHA-256|CRC32C)[[:space:]]*=' "$1" | sed 's/[[:space:]]\+/ /g'; }
          extract base.log > base.kat
          extract cand.log > cand.kat
          echo "--- baseline KAT ---"; cat base.kat
          echo "--- candidate KAT ---"; cat cand.kat
          [ -s cand.kat ] || { echo "::error::candidate produced no KAT lines — the JVM did not run. See cand.log."; exit 1; }
          if ! diff -u base.kat cand.kat; then
            echo "::error::crypto reference outputs differ — patched path is NOT bit-identical. Correctness regression."
            exit 1
          fi
          echo "Correctness identical ✅"

      - name: Assert crypto flags flip OFF -> ON (when the emulated CPU exposes crypto)
        run: |
          python3 - <<'PY'
          import re, sys

          FLAGS = ('UseAES','UseAESIntrinsics','UseGHASHIntrinsics',
                   'UseSHA','UseSHA256Intrinsics','UseCRC32CIntrinsics')

          def flags(path):
              f = {}
              for line in open(path):
                  for n in FLAGS:
                      if n in f:
                          continue
                      m = re.search(r'\b' + n + r'\b\D*?(true|false)', line)
                      if m:
                          f[n] = m.group(1)
              return f

          def cpuline(path):
              for l in open(path):
                  if 'CPU:' in l and 'total' in l:
                      return l.strip()
              return ''

          fb, fc = flags('base.log'), flags('cand.log')
          cb, cc = cpuline('base.log'), cpuline('cand.log')
          print('baseline  CPU:', cb or '(not captured)')
          print('candidate CPU:', cc or '(not captured)')
          print('baseline  flags:', fb)
          print('candidate flags:', fc)

          # Does the emulated CPU actually advertise crypto ISA? The os+cpu
          # feature line reflects HotSpot's _features, i.e. what AT_HWCAP carried.
          # If the candidate line names aes/sha, the emulated -cpu has the ID
          # fields and the patch MUST have turned the intrinsics on.
          crypto_isa = bool(re.search(r'\b(aes|sha1|sha2|sha256|sha512|sha3|pmull|crc32)\b', cc, re.I))

          fail = False
          # Patch must never DISABLE a feature the baseline had.
          for k in FLAGS:
              if fb.get(k) == 'true' and fc.get(k) == 'false':
                  print(f"::error::{k} regressed true->false under the patch")
                  fail = True

          if crypto_isa:
              # The real proof: crypto-capable emulated CPU -> candidate ON.
              want = ('UseAES','UseAESIntrinsics','UseSHA')
              flipped = [k for k in want if fb.get(k) == 'false' and fc.get(k) == 'true']
              on_cand = [k for k in want if fc.get(k) == 'true']
              print(f"emulated CPU exposes crypto ISA -> enforcing ON. flipped={flipped} on_candidate={on_cand}")
              if not on_cand:
                  print("::error::candidate CPU advertises crypto but no crypto intrinsic is ON — #20 not taking effect")
                  fail = True
              elif not flipped:
                  print("::warning::crypto is ON on candidate but baseline already had it ON (stock not crypto-OFF?) — check base.log")
          else:
              print("::warning::emulated -cpu does not advertise crypto ISA in ID registers, "
                    "so the OFF->ON flip cannot be proven here. To prove it under TCG, make ops/QEMU "
                    "use `-cpu max` (which exposes AES/SHA/CRC32). KAT identity is still enforced above.")

          sys.exit(1 if fail else 0)
          PY

      - name: Summarize flag delta (TCG — no perf numbers)
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          FLAGS = ('UseAES','UseAESIntrinsics','UseGHASHIntrinsics',
                   'UseSHA','UseSHA256Intrinsics','UseCRC32CIntrinsics','UseChaCha20Intrinsics')
          def flags(path):
              f = {}
              try:
                  lines = open(path)
              except OSError:
                  return f
              for line in lines:
                  for n in FLAGS:
                      if n in f: continue
                      m = re.search(r'\b' + n + r'\b\D*?(true|false)', line)
                      if m: f[n] = m.group(1)
              return f
          def cpuline(path):
              try:
                  for l in open(path):
                      if 'CPU:' in l and 'total' in l:
                          return l.strip()
              except OSError:
                  pass
              return '(not captured)'
          fb, fc = flags('base.log'), flags('cand.log')
          print("## HWCAP #20 — correctness (arm64, TCG)\n")
          print("Perf is not measured here (TCG). See the `perf` job for KVM MB/s.\n")
          print("### CPU feature line (`-Xlog:os+cpu`)")
          print(f"- **baseline** : `{cpuline('base.log')}`")
          print(f"- **candidate**: `{cpuline('cand.log')}`\n")
          print("### Intrinsic flags")
          print("| flag | baseline | candidate |")
          print("|---|---|---|")
          for k in FLAGS:
              print(f"| {k} | {fb.get(k,'?')} | {fc.get(k,'?')} |")
          PY
          echo "wrote job summary"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwcap20-correctness-tcg
          path: |
            base.log
            cand.log
            base.kat
            cand.kat
            bench-config.json

  # ====================================================================
  # PERF — KVM only, opt-in. The speedup numbers. Never runs on push; point
  # `runner_label` at a self-hosted arm64 host that exposes /dev/kvm.
  # ====================================================================
  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner_label || 'arm64-kvm' }}
    steps:
      - name: Checkout (this ref = the patch candidate)
        uses: actions/checkout@v4

      - name: Require /dev/kvm (refuse to measure under TCG)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm absent — this runner would fall back to TCG."
            echo "A crypto perf A/B under TCG is meaningless. Use an arm64 KVM host."
            exit 1
          fi
          ls -l /dev/kvm
          echo "== host CPU crypto features =="
          (grep -m1 -i 'Features' /proc/cpuinfo || lscpu) | tr ' ' '\n' \
            | grep -iE 'aes|sha1|sha2|sha3|pmull|crc32|asimd|^fp$' | sort -u || true

      - name: Install build deps
        run: |
          # ops's get.sh gates on `which qemu-system-x86_64` even on arm64, so
          # install qemu-system-x86 just to satisfy that check; qemu-system-arm
          # provides qemu-system-aarch64, which actually boots the arm64 guest.
          sudo apt-get update
          sudo apt-get install -y build-essential binutils wget git python3 \
            qemu-system-x86 qemu-system-arm qemu-utils
          which qemu-system-x86_64 qemu-system-aarch64

      - name: Set up a JDK to compile the benchmark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile CryptoBench (portable bytecode)
        run: |
          javac --release 11 -d bench-classes test/jvm/CryptoBench.java
          ls -l bench-classes/CryptoBench.class

      - name: Install ops
        run: |
          curl https://ops.city/get.sh -sSfL | sh
          echo "$HOME/.ops/bin" >> "$GITHUB_PATH"

      - name: Build candidate kernel (this ref = the patch)
        run: |
          make -j"$(nproc)" kernel PLATFORM=virt
          cp "$(find output/platform/virt -name kernel.img | head -1)" /tmp/kernel-candidate.img
          ls -l /tmp/kernel-candidate.img

      - name: Write ops bench config
        run: |
          cp bench-classes/CryptoBench.class .
          cat > bench-config.json <<EOF
          {
            "Args": ["-Xlog:os+cpu", "-XX:+PrintFlagsFinal",
                     "-Dbench.ms=${BENCH_MS}", "-cp", "/", "CryptoBench"],
            "Files": ["CryptoBench.class"],
            "RunConfig": { "Memory": "2G" }
          }
          EOF
          cat bench-config.json

      - name: Prime ops nightly cache and capture the STOCK kernel as baseline
        run: |
          ops pkg get "${JRE_PACKAGE}" --arch arm64 --nightly || true
          OPSK="$(find "$HOME/.ops" -name kernel.img -path '*nightly*' | head -1)"
          [ -n "$OPSK" ] || { echo "::error::could not locate ops nightly kernel.img"; exit 1; }
          echo "ops kernel slot: $OPSK"
          cp "$OPSK" /tmp/kernel-baseline.img
          echo "OPSK=$OPSK" >> "$GITHUB_ENV"
          ls -l /tmp/kernel-baseline.img

      - name: Run A/B (stock baseline then patched candidate) under KVM
        run: |
          set -eo pipefail
          run_one () {
            local kimg="$1" tag="$2" out="$3"
            cp "$kimg" "$OPSK"
            echo "=== running $tag (kernel=$kimg) ==="
            ops pkg load "${JRE_PACKAGE}" --arch arm64 --nightly \
              --accel --show-debug --verbose -c bench-config.json 2>&1 | tee "$out"
          }
          run_one /tmp/kernel-baseline.img  BASELINE  base.log
          run_one /tmp/kernel-candidate.img CANDIDATE cand.log

      - name: Verify KVM engaged (not TCG) in both runs
        run: |
          for f in base.log cand.log; do
            if grep -qiE 'accel=kvm|enable-kvm' "$f" && ! grep -qi 'kvm.*not supported' "$f"; then
              echo "$f: KVM engaged ✅"
            else
              echo "::error::$f did not run under KVM (would be TCG) — aborting."
              grep -iE 'qemu-system|[-]cpu|[-]machine|accel|kvm|not supported' "$f" | head -20 || true
              exit 1
            fi
          done

      - name: Assert correctness identical (HW must equal SW)
        run: |
          extract () { grep -E '(AES-GCM tag|SHA-256|CRC32C)[[:space:]]*=' "$1" | sed 's/[[:space:]]\+/ /g'; }
          extract base.log > base.kat
          extract cand.log > cand.kat
          echo "--- baseline KAT ---"; cat base.kat
          echo "--- candidate KAT ---"; cat cand.kat
          if ! diff -u base.kat cand.kat; then
            echo "::error::crypto reference outputs differ — patched path is NOT bit-identical. Correctness regression."
            exit 1
          fi
          echo "Correctness identical ✅ (speedup is real work, not corruption)"

      - name: Summarize throughput delta
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re

          def best(path):
              d = {}
              for line in open(path):
                  m = re.search(r'(AES-256-GCM|SHA-256|CRC32C)\s+BEST\s*:\s*([0-9.]+)\s*MB/s', line)
                  if m:
                      d[m.group(1)] = float(m.group(2))
              return d

          def flags(path):
              f = {}
              names = ('UseAES','UseAESIntrinsics','UseGHASHIntrinsics',
                       'UseSHA256Intrinsics','UseCRC32CIntrinsics','UseChaCha20Intrinsics')
              for line in open(path):
                  for n in names:
                      if n in f:
                          continue
                      m = re.search(r'\b' + n + r'\b.*?(true|false)', line)
                      if m:
                          f[n] = m.group(1)
              return f

          def cpuline(path):
              for l in open(path):
                  if 'CPU:' in l and 'total' in l:
                      return l.strip()
              return '(not captured)'

          b, c = best('base.log'), best('cand.log')
          fb, fc = flags('base.log'), flags('cand.log')

          print("## HWCAP #20 crypto A/B (arm64, KVM)\n")
          print("### CPU feature line (`-Xlog:os+cpu`)")
          print(f"- **baseline** : `{cpuline('base.log')}`")
          print(f"- **candidate**: `{cpuline('cand.log')}`\n")

          print("### Intrinsic flags")
          print("| flag | baseline | candidate |")
          print("|---|---|---|")
          for k in ('UseAES','UseAESIntrinsics','UseGHASHIntrinsics',
                    'UseSHA256Intrinsics','UseCRC32CIntrinsics','UseChaCha20Intrinsics'):
              print(f"| {k} | {fb.get(k,'?')} | {fc.get(k,'?')} |")

          print("\n### Throughput")
          print("| algo | baseline MB/s | candidate MB/s | speedup |")
          print("|---|--:|--:|--:|")
          for k in ('AES-256-GCM','SHA-256','CRC32C'):
              if k in b and k in c and b[k] > 0:
                  print(f"| {k} | {b[k]:,.0f} | {c[k]:,.0f} | **{c[k]/b[k]:.2f}×** |")
              else:
                  print(f"| {k} | {b.get(k,'?')} | {c.get(k,'?')} | — |")
          PY
          echo "wrote job summary"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwcap20-crypto-ab-kvm
          path: |
            base.log
            cand.log
            base.kat
            cand.kat
            bench-config.json
